server.port=${PORT:8080}
spring.application.name=cafe-erp

# Default active profile for local development.
# Override with SPRING_PROFILES_ACTIVE=prod (env var) or --spring.profiles.active=prod
spring.profiles.active=dev

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Actuator — expose health endpoint only
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN

# -------------------------------
# AI Assistant — Model Providers
# -------------------------------
# Ordered list: Groq (primary), Cerebras (fallback).
# API keys are read from environment variables.
assistant.providers[0].name=groq
assistant.providers[0].baseUrl=https://api.groq.com/openai/v1
assistant.providers[0].apiKeyEnvVar=GROQ_API_KEY
assistant.providers[0].model=llama-3.3-70b-versatile
assistant.providers[0].supportsMinTokens=false

assistant.providers[1].name=cerebras
assistant.providers[1].baseUrl=https://api.cerebras.ai/v1
assistant.providers[1].apiKeyEnvVar=CEREBRAS_API_KEY
assistant.providers[1].model=gpt-oss-120b
assistant.providers[1].supportsMinTokens=true

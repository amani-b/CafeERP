server.port=${PORT:8080}
spring.application.name=cafe-erp

# Default active profile for local development.
# Override with SPRING_PROFILES_ACTIVE=prod (env var) or --spring.profiles.active=prod
spring.profiles.active=dev

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Actuator — expose health endpoint only
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN,SUPER_ADMIN

# -------------------------------
# AI Assistant — Model Providers
# -------------------------------
# Ordered list: Groq (primary), Gemini (secondary), OpenRouter (tertiary).
# API keys are read from environment variables.
# Note: All baseUrls end BEFORE /chat/completions (the code appends this suffix).
assistant.providers[0].name=groq
assistant.providers[0].baseUrl=https://api.groq.com/openai/v1
assistant.providers[0].apiKeyEnvVar=GROQ_API_KEY
assistant.providers[0].model=openai/gpt-oss-120b
assistant.providers[0].supportsMinTokens=false

assistant.providers[1].name=gemini
assistant.providers[1].baseUrl=https://generativelanguage.googleapis.com/v1beta/openai
assistant.providers[1].apiKeyEnvVar=GEMINI_API_KEY
assistant.providers[1].model=gemini-flash-latest
assistant.providers[1].supportsMinTokens=false

assistant.providers[2].name=openrouter
assistant.providers[2].baseUrl=https://openrouter.ai/api/v1
assistant.providers[2].apiKeyEnvVar=OPENROUTER_API_KEY
assistant.providers[2].model=openrouter/free
assistant.providers[2].supportsMinTokens=false

# -------------------------------
# Assistant chat retention
# -------------------------------
# Conversations with no activity for this many days are soft-archived by the
# nightly job: hidden from the default history list, recoverable via the
# history "Archived" filter. Not deleted.
assistant.chat.archive-after-days=30
# Conversations are PERMANENTLY deleted (messages included) this many days
# after they were archived. Default 90 days archived. Tune or effectively
# disable (set very large, e.g. 365000) via configuration.
assistant.chat.purge-after-days=90
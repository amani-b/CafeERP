# -------------------------------
# DEMO PROFILE — public sandbox
# -------------------------------
# Safe-by-construction public demo: every visitor gets a private,
# session-scoped in-memory sandbox seeded from a static fixture.
# No demo code path may ever touch the production database, so this file
# deliberately defines its OWN datasource (throwaway H2 in-memory) and
# NEVER references ${DB_URL} / ${DB_USERNAME} / ${DB_PASSWORD}. Even if a
# production DB URL is present in the environment by accident, the demo
# profile cannot see it — there is no fallback chain to production.
#
# Run: SPRING_PROFILES_ACTIVE=demo (no API keys or database required).

# Throwaway in-memory database for the (unused-by-demo-repos) JPA layer.
# All demo reads/writes go to the session-scoped in-memory repositories;
# this datasource exists only so the JPA/Hibernate beans still initialise.
# It is always empty H2 — never production data.
spring.datasource.url=jdbc:h2:mem:cafedemo;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# No Flyway in demo: there is no shared schema to migrate (each session
# clones the static seed fixture instead).
spring.flyway.enabled=false

# No background AI-title backfill in demo: it runs on daemon threads with no
# HTTP session and could never reach the session-scoped demo stores (threads
# keep their derived titles; the live single-round-trip title tag still works
# in-request when AI keys are provided).
assistant.title.backfill-enabled=false

spring.thymeleaf.cache=true
logging.level.com.cafeerp=INFO
spring.jpa.show-sql=false

# Reverse-proxy support (same as prod — the demo also runs behind Render).
server.forward-headers-strategy=framework

# Session expiry = full sandbox reset: after 25 minutes of inactivity Spring
# evicts the session and with it every session-scoped demo bean. No cleanup
# job needed. Single-instance only — no session replication is configured.
server.servlet.session.timeout=25m
server.servlet.session.cookie.secure=true

<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!-- ============================================================ -->
<!-- Head fragment: shared <head> contents except <title>         -->
<!-- ============================================================ -->
<head th:fragment="head">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/franken-ui@2.1.2/dist/css/core.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/franken-ui@2.1.2/dist/css/utilities.min.css">
    <script src="https://cdn.jsdelivr.net/npm/franken-ui@2.1.2/dist/js/core.iife.js"></script>
</head>

<!-- ============================================================ -->
<!-- Top navigation bar fragment                                   -->
<!-- activePage parameter controls uk-active highlighting          -->
<!-- Rebuilt with real Franken UI v2.1.2 (Dos) classes:            -->
<!--   uk-container, uk-nav, uk-nav-default, uk-active, uk-toggle  -->
<!--   plus Tailwind-style utilities (flex, hidden, lg:flex, etc.) -->
<!-- ============================================================ -->
<nav th:fragment="nav(activePage)" class="sticky top-0 bg-background border-b">
    <div class="uk-container uk-container-expand flex items-center justify-between">
        <a class="font-semibold text-lg" th:href="@{/}">Cafe ERP</a>
        <ul class="uk-nav uk-nav-default hidden lg:flex lg:items-center lg:gap-4">
            <li th:classappend="${activePage == 'dashboard'} ? 'uk-active' : ''">
                <a th:href="@{/}">Dashboard</a>
            </li>
            <li sec:authorize="hasRole('ADMIN')" th:classappend="${activePage == 'categories'} ? 'uk-active' : ''">
                <a th:href="@{/categories}">Categories</a>
            </li>
            <li sec:authorize="hasRole('ADMIN')" th:classappend="${activePage == 'menu'} ? 'uk-active' : ''">
                <a th:href="@{/menu}">Menu</a>
            </li>
            <li sec:authorize="hasAnyRole('STAFF','ADMIN')" th:classappend="${activePage == 'orders'} ? 'uk-active' : ''">
                <a th:href="@{/orders}">Orders</a>
            </li>
            <li sec:authorize="hasAnyRole('KITCHEN','ADMIN')" th:classappend="${activePage == 'kitchen'} ? 'uk-active' : ''">
                <a th:href="@{/kitchen}">Kitchen</a>
            </li>
            <li sec:authorize="hasRole('ADMIN')" th:classappend="${activePage == 'reports'} ? 'uk-active' : ''">
                <a th:href="@{/reports}">Reports</a>
            </li>
            <li sec:authorize="hasRole('ADMIN')" th:classappend="${activePage == 'inventory'} ? 'uk-active' : ''">
                <a th:href="@{/inventory}">Inventory</a>
            </li>
            <li sec:authorize="hasRole('ADMIN')" th:classappend="${activePage == 'assistant-admin'} ? 'uk-active' : ''">
                <a th:href="@{/admin/assistant}">Assistant Logs</a>
            </li>
            <li th:classappend="${activePage == 'account'} ? 'uk-active' : ''">
                <a th:href="@{/account/password}">Change Password</a>
            </li>
            <li>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="border-0"
                            style="background:none;border:none;cursor:pointer;color:inherit;">
                        Logout
                    </button>
                </form>
            </li>
        </ul>
        <!-- Mobile hamburger: toggles offcanvas drawer (inline SVG since 'menu' icon absent from Franken v2.1.2) -->
        <button class="flex lg:hidden p-2" type="button" uk-toggle="target: #mobile-nav" aria-label="Open menu">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
    </div>
</nav>

<!-- Mobile offcanvas navigation -->
<div id="mobile-nav" uk-offcanvas="overlay: true; flip: true">
    <div class="uk-offcanvas-bar">
        <button class="absolute top-4 right-4" type="button" uk-close uk-toggle="target: #mobile-nav"></button>
        <ul class="uk-nav uk-nav-default mt-4">
            <li th:classappend="${activePage == 'dashboard'} ? 'uk-active' : ''">
                <a th:href="@{/}">Dashboard</a>
            </li>
            <li sec:authorize="hasRole('ADMIN')" th:classappend="${activePage == 'categories'} ? 'uk-active' : ''">
                <a th:href="@{/categories}">Categories</a>
            </li>
            <li sec:authorize="hasRole('ADMIN')" th:classappend="${activePage == 'menu'} ? 'uk-active' : ''">
                <a th:href="@{/menu}">Menu</a>
            </li>
            <li sec:authorize="hasAnyRole('STAFF','ADMIN')" th:classappend="${activePage == 'orders'} ? 'uk-active' : ''">
                <a th:href="@{/orders}">Orders</a>
            </li>
            <li sec:authorize="hasAnyRole('KITCHEN','ADMIN')" th:classappend="${activePage == 'kitchen'} ? 'uk-active' : ''">
                <a th:href="@{/kitchen}">Kitchen</a>
            </li>
            <li sec:authorize="hasRole('ADMIN')" th:classappend="${activePage == 'reports'} ? 'uk-active' : ''">
                <a th:href="@{/reports}">Reports</a>
            </li>
            <li sec:authorize="hasRole('ADMIN')" th:classappend="${activePage == 'inventory'} ? 'uk-active' : ''">
                <a th:href="@{/inventory}">Inventory</a>
            </li>
            <li sec:authorize="hasRole('ADMIN')" th:classappend="${activePage == 'assistant-admin'} ? 'uk-active' : ''">
                <a th:href="@{/admin/assistant}">Assistant Logs</a>
            </li>
            <li th:classappend="${activePage == 'account'} ? 'uk-active' : ''">
                <a th:href="@{/account/password}">Change Password</a>
            </li>
            <li class="uk-nav-divider"></li>
            <li>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="w-full">Logout</button>
                </form>
            </li>
        </ul>
    </div>
</div>

<!-- ============================================================ -->
<!-- Assistant chat widget fragment                                -->
<!-- Byte-for-byte identical to the original markup                -->
<!-- ============================================================ -->
<div th:fragment="assistant-widget" sec:authorize="isAuthenticated()" id="assistant-chat-widget">
    <div id="assistant-chat-panel">
        <div id="assistant-chat-header">
            <span>AI Assistant</span>
            <button id="assistant-chat-close" aria-label="Close">&times;</button>
        </div>
        <div id="assistant-chat-messages"></div>
        <div id="assistant-chat-input-area">
            <textarea id="assistant-chat-input" rows="1" placeholder="Ask a question..." aria-label="Chat message"></textarea>
            <button id="assistant-chat-send" aria-label="Send">&uarr;</button>
        </div>
    </div>
    <button id="assistant-chat-bubble" aria-label="Open assistant chat">&#x1F4AC;</button>
</div>
<link rel="stylesheet" th:href="@{/css/assistant-chat.css}">
<script th:src="@{/js/assistant-chat.js}"></script>
</html>

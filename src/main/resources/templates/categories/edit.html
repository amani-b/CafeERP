<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head(title='Edit Category')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav(activePage='categories')}"></nav>

<main class="uk-container max-w-7xl mx-auto px-4 py-8">
    <section class="page-header card-pad mb-8">
        <div>
            <p class="eyebrow text-sm font-medium uppercase tracking-wider mb-1">Cafe ERP</p>
            <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight">Edit Category</h1>
            <p class="subtitle text-sm mt-1">Update the details for this product category.</p>
        </div>
    </section>

    <section class="card card-pad">
        <form th:action="@{/categories/update/{id}(id=${category.id})}" th:object="${category}" method="post" class="uk-width-1-2@m">
            <div class="mb-4">
                <label for="name" class="field-label">Name</label>
                <input type="text" id="name" class="uk-input w-full" th:field="*{name}" placeholder="e.g. Beverages"
                       th:classappend="${#fields.hasErrors('name')} ? 'uk-form-danger'">
                <div class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Name is required</div>
            </div>

            <div class="mb-4">
                <label for="description" class="field-label">Description</label>
                <textarea id="description" class="uk-textarea w-full" rows="3" th:field="*{description}" placeholder="Optional description"></textarea>
            </div>

            <div class="mb-6">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" class="uk-checkbox" th:field="*{active}">
                    <span class="text-sm">Active</span>
                </label>
            </div>

            <div class="flex flex-wrap items-center gap-3">
                <button type="submit" class="btn btn-primary px-5 text-sm"><span class="btn-label">Update</span></button>
                <a class="btn btn-secondary px-5 text-sm" th:href="@{/categories}"><span class="btn-label">Cancel</span></a>
            </div>
        </form>
    </section>
</main>

<div th:replace="~{fragments/layout :: assistant-widget}"></div>
</body>
</html>

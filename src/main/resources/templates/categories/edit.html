<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Category - Cafe ERP</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/franken-ui@2.1.2/dist/css/core.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/franken-ui@2.1.2/dist/css/utilities.min.css">
</head>
<body>
<nav th:replace="~{fragments/layout :: nav(activePage='categories')}"></nav>

<main class="uk-container uk-margin-top">
    <h1 class="uk-h2">Edit Category</h1>

    <form th:action="@{/categories/update/{id}(id=${category.id})}" th:object="${category}" method="post" class="uk-width-1-2@m">
        <div class="uk-margin">
            <label for="name" class="uk-form-label">Name</label>
            <div class="uk-form-controls">
                <input type="text" id="name" class="uk-input" th:field="*{name}"
                       th:classappend="${#fields.hasErrors('name')} ? 'uk-form-danger'">
                <div class="uk-text-danger uk-text-small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Name is required</div>
            </div>
        </div>

        <div class="uk-margin">
            <label for="description" class="uk-form-label">Description</label>
            <div class="uk-form-controls">
                <textarea id="description" class="uk-textarea" rows="3" th:field="*{description}"></textarea>
            </div>
        </div>

        <div class="uk-margin">
            <label>
                <input type="checkbox" class="uk-checkbox" th:field="*{active}">
                <span class="uk-margin-small-left">Active</span>
            </label>
        </div>

        <button type="submit" class="uk-button uk-button-primary">Update</button>
        <a class="uk-button uk-button-default" th:href="@{/categories}">Cancel</a>
    </form>
</main>

<div th:replace="~{fragments/layout :: assistant-widget}"></div>
</body>
</html>

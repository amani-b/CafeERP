<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Categories - Cafe ERP</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/franken-ui@2.1.2/dist/css/core.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/franken-ui@2.1.2/dist/css/utilities.min.css">
</head>
<body>
<nav th:replace="~{fragments/layout :: nav(activePage='categories')}"></nav>

<main class="uk-container uk-margin-top">
    <div class="uk-flex uk-flex-between uk-margin-bottom">
        <h1 class="uk-h2 uk-margin-remove">Categories</h1>
        <a class="uk-button uk-button-primary" th:href="@{/categories/new}">New Category</a>
    </div>

    <div class="uk-overflow-auto">
        <table class="uk-table uk-table-striped uk-table-middle">
            <thead>
            <tr>
                <th>Name</th>
                <th>Description</th>
                <th>Active</th>
                <th class="uk-text-right">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(categories)}">
                <td colspan="4" class="uk-text-center uk-text-muted">No categories yet.</td>
            </tr>
            <tr th:each="category : ${categories}">
                <td th:text="${category.name}">Beverages</td>
                <td th:text="${category.description}">Coffee and tea</td>
                <td>
                    <span class="uk-label uk-label-success" th:if="${category.active}">Active</span>
                    <span class="uk-label" th:unless="${category.active}">Inactive</span>
                </td>
                <td class="uk-text-right">
                    <a class="uk-button uk-button-default uk-button-small" th:href="@{/categories/edit/{id}(id=${category.id})}">Edit</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<div th:replace="~{fragments/layout :: assistant-widget}"></div>
</body>
</html>

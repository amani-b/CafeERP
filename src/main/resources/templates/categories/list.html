<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head(title='Categories')}"></head>
<body class="authenticated">
<div th:replace="~{fragments/layout :: sidebar(activePage='categories')}"></div>
<div th:replace="~{fragments/layout :: mobile-header}"></div>
<div th:replace="~{fragments/layout :: mobile-nav(activePage='categories')}"></div>

<main class="uk-container max-w-7xl mx-auto px-4 py-8">
    <section class="page-header card-pad mb-8">
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
            <div>
                <p class="eyebrow text-sm font-medium uppercase tracking-wider mb-1">Cafe ERP</p>
                <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight">Categories</h1>
                <p class="subtitle text-sm mt-1">Organise menu items into product categories.</p>
            </div>
            <a th:href="@{/categories/new}" class="btn btn-primary px-5 text-sm" style="background:#fff;color:var(--ink);border-color:#fff;">
                <span class="btn-label">New Category</span>
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </a>
        </div>
    </section>

    <section class="card card-pad">
        <div th:if="${#lists.isEmpty(categories)}" class="empty-state">
            <div class="icon-tile">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            </div>
            <h3>No categories yet</h3>
            <p>Create a category before adding menu items.</p>
            <a th:href="@{/categories/new}" class="btn btn-primary px-5 text-sm mt-4"><span class="btn-label">Add a category</span></a>
        </div>
        <div class="table-wrap" th:unless="${#lists.isEmpty(categories)}">
            <table class="uk-table uk-table-middle">
                <thead>
                <tr>
                    <th>Name</th>
                    <th>Description</th>
                    <th>Active</th>
                    <th class="uk-text-right">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="category : ${categories}">
                    <td class="font-semibold" th:text="${category.name}">Beverages</td>
                    <td class="text-sm text-muted" th:text="${category.description}">Coffee and tea</td>
                    <td>
                        <span class="badge badge-success" th:if="${category.active}">Active</span>
                        <span class="badge badge-neutral" th:unless="${category.active}">Inactive</span>
                    </td>
                    <td class="uk-text-right">
                        <a class="btn btn-secondary px-4 text-sm" th:href="@{/categories/edit/{id}(id=${category.id})}"><span class="btn-label">Edit</span></a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

<div th:replace="~{fragments/layout :: assistant-widget}"></div>
</body>
</html>

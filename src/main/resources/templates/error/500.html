<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head(title='Internal Server Error')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav(activePage='dashboard')}"></nav>

<main class="uk-container flex items-center justify-center" style="min-height:60vh;">
    <div class="text-center" style="max-width:26rem;">
        <p class="font-extrabold num" style="font-size:4rem;line-height:1;color:var(--line-strong);">500</p>
        <h2 class="text-xl font-bold mt-2" th:text="${error}">Internal Server Error</h2>
        <p class="text-sm text-muted mt-2" th:text="${message}">Something went wrong.</p>
        <a class="btn btn-primary px-5 text-sm mt-6" th:href="@{/}"><span class="btn-label">Back to Dashboard</span></a>
    </div>
</main>

<div th:replace="~{fragments/layout :: assistant-widget}"></div>
</body>
</html>

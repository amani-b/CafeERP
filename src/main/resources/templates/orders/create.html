<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>New Order - Cafe ERP</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/franken-ui@2.1.2/dist/css/core.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/franken-ui@2.1.2/dist/css/utilities.min.css">
</head>
<body>
<nav th:replace="~{fragments/layout :: nav(activePage='orders')}"></nav>

<main class="uk-container uk-margin-top">
    <h1 class="uk-h2">New Order</h1>

    <div class="uk-alert-danger" uk-alert th:if="${errorMessage}" th:text="${errorMessage}">
        Select at least one available menu item.
    </div>

    <form action="/orders" th:action="@{/orders}" method="post">
        <div class="uk-overflow-auto">
            <table class="uk-table uk-table-striped uk-table-middle">
                <thead>
                <tr>
                    <th>Menu Item</th>
                    <th>Category</th>
                    <th>Unit Price</th>
                    <th class="uk-width-1-4">Quantity</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(menuItems)}">
                    <td colspan="4" class="uk-text-center uk-text-muted">No available menu items.</td>
                </tr>
                <tr th:each="menuItem : ${menuItems}">
                    <td th:text="${menuItem.name}">Cappuccino</td>
                    <td th:text="${menuItem.category.name}">Beverages</td>
                    <td th:text="${#numbers.formatDecimal(menuItem.price, 1, 2)}">250.00</td>
                    <td>
                        <input type="number" min="0" value="0" class="uk-input uk-form-small uk-width-small"
                               th:name="${'quantities[' + menuItem.id + ']'}">
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <button type="submit" class="uk-button uk-button-primary" th:disabled="${#lists.isEmpty(menuItems)}">Create Order</button>
        <a class="uk-button uk-button-default" th:href="@{/orders}">Cancel</a>
    </form>
</main>

<div th:replace="~{fragments/layout :: assistant-widget}"></div>
</body>
</html>

<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head(title='Orders')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav(activePage='orders')}"></nav>

<main class="uk-container max-w-7xl mx-auto px-4 py-8">
    <!-- Page header -->
    <section class="page-header card-pad mb-8">
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
            <div>
                <p class="eyebrow text-sm font-medium uppercase tracking-wider mb-1">Cafe ERP</p>
                <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight">Orders</h1>
                <p class="subtitle text-sm mt-1">Track, update, and serve customer orders.</p>
            </div>
            <a th:href="@{/orders/new}" class="btn btn-primary px-5 text-sm" style="background:#fff;color:var(--ink);border-color:#fff;">
                <span class="btn-label">New Order</span>
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </a>
        </div>
    </section>

    <!-- Orders table -->
    <section class="card card-pad">
        <div th:if="${#lists.isEmpty(orders)}" class="empty-state">
            <div class="icon-tile">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
            </div>
            <h3>No orders yet</h3>
            <p>Orders placed by staff will show up here.</p>
            <a th:href="@{/orders/new}" class="btn btn-primary px-5 text-sm mt-4"><span class="btn-label">Create the first order</span></a>
        </div>
        <div class="table-wrap" th:unless="${#lists.isEmpty(orders)}">
            <table class="uk-table uk-table-middle">
                <thead>
                <tr>
                    <th>Order ID</th>
                    <th>Date/Time</th>
                    <th>Items</th>
                    <th>Total Amount</th>
                    <th>#</th>
                    <th>Status</th>
                    <th></th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="order : ${orders}">
                    <td class="num font-semibold" th:text="'#' + ${order.id}">#1</td>
                    <td class="num text-sm text-muted" th:text="${#temporals.format(order.createdAt, 'yyyy-MM-dd HH:mm')}">2026-07-04 08:00</td>
                    <td>
                        <ul class="uk-list uk-list-small uk-margin-remove">
                            <li th:each="item : ${order.items}" th:text="${item.itemName + ' x' + item.quantity}">
                                Latte x 2
                            </li>
                        </ul>
                    </td>
                    <td class="num font-semibold" th:text="'$' + ${#numbers.formatDecimal(order.totalAmount, 1, 2)}">$0.00</td>
                    <td class="num" th:text="${order.itemCount}">0</td>
                    <td>
                        <span class="badge"
                              th:classappend="${order.status.name() == 'PENDING'} ? 'badge-info' : (${order.status.name() == 'PREPARING'} ? 'badge-warn' : (${order.status.name() == 'READY'} ? 'badge-success' : 'badge-neutral'))"
                              th:text="${order.status}">PENDING</span>
                    </td>
                    <td>
                        <form th:action="@{/orders/{id}/status(id=${order.id})}" method="post" class="flex items-center gap-2">
                            <select name="status" class="uk-select uk-form-small uk-width-auto">
                                <option th:each="s : ${statuses}" th:value="${s.name()}" th:text="${s.name()}" th:selected="${s == order.status}"></option>
                            </select>
                            <button type="submit" class="btn btn-secondary px-3 text-sm"><span class="btn-label">Update</span></button>
                        </form>
                    </td>
                    <td>
                        <a class="btn btn-secondary px-4 text-sm" th:href="@{/orders/{id}(id=${order.id})}"><span class="btn-label">View / Print</span></a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

<div th:replace="~{fragments/layout :: assistant-widget}"></div>
</body>
</html>

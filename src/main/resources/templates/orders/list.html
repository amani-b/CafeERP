<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Orders - Cafe ERP</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/franken-ui@2.1.2/dist/css/core.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/franken-ui@2.1.2/dist/css/utilities.min.css">
    <script src="https://cdn.jsdelivr.net/npm/franken-ui@2.1.2/dist/js/core.iife.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* ─── Base ─────────────────────────────────────────────── */
        /* All interactive/color styling lives in raw CSS because
           Franken UI v2.1.2 utilities.min.css exposes only semantic
           token colors (bg-background, text-foreground, etc.) and
           no shadow/transition/transform utilities.               */
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #f3f4f6; /* gray-100 */
            color: #111827;            /* gray-900 */
        }

        /* ─── Page header ──────────────────────────────────────── */
        .dash-hero {
            background: linear-gradient(135deg, #111827 0%, #1f2937 55%, #374151 100%);
            color: #fff;
            border-radius: 1.25rem;
        }

        /* ─── Card style ───────────────────────────────────────── */
        .stat-card {
            background: #ffffff;
            border: 1px solid #e5e7eb; /* gray-200 */
            border-radius: 1.25rem;
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
                        box-shadow 0.25s ease;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }
        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px -8px rgba(0, 0, 0, 0.18);
        }

        /* ─── Bouncy button (consistent with login/change-password) ─ */
        .btn-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background-color: #111827; /* gray-900 */
            color: #ffffff;
            border: none;
            cursor: pointer;
            border-radius: 0.75rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -2px rgba(0, 0, 0, 0.2);
            transform: translateY(-1px);
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
                        background-color 0.25s ease,
                        box-shadow 0.25s ease;
        }
        .btn-primary:hover {
            background-color: #374151; /* gray-700 */
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4), 0 4px 6px -4px rgba(0, 0, 0, 0.2);
        }
        .btn-primary:active {
            transform: translateY(0) scale(0.95);
            box-shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.3);
            transition: transform 0.08s ease;
        }
        .btn-primary:focus-visible {
            outline: none;
            box-shadow: 0 0 0 2px #ffffff, 0 0 0 4px #6b7280;
        }

        /* ─── Secondary button ─────────────────────────────────── */
        .btn-secondary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background-color: #ffffff;
            color: #111827;
            border: 1px solid #e5e7eb; /* gray-200 */
            cursor: pointer;
            border-radius: 0.75rem;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
                        background-color 0.25s ease,
                        box-shadow 0.25s ease;
        }
        .btn-secondary:hover {
            background-color: #f9fafb; /* gray-50 */
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
        }
        .btn-secondary:active {
            transform: translateY(0) scale(0.97);
            transition: transform 0.08s ease;
        }
        .btn-secondary:focus-visible {
            outline: none;
            box-shadow: 0 0 0 2px #ffffff, 0 0 0 4px #6b7280;
        }

        /* ─── Status pill ─────────────────────────────────────── */
        .pill {
            display: inline-flex;
            align-items: center;
            gap: 0.375rem;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .pill-warn {
            background-color: #fef3c7; /* yellow-100 */
            color: #92400e;            /* yellow-800 */
            border: 1px solid #fde68a; /* yellow-200 */
        }
        .pill-ok {
            background-color: #dcfce7; /* green-100 */
            color: #166534;            /* green-800 */
            border: 1px solid #bbf7d0; /* green-200 */
        }
    </style>
</head>
<body>
<nav th:replace="~{fragments/layout :: nav(activePage='orders')}"></nav>

<main class="uk-container max-w-7xl mx-auto px-4 py-8">
    <!-- Page header -->
    <section class="dash-hero p-6 sm:p-8 mb-8">
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
            <div>
                <p class="text-sm font-medium uppercase tracking-wider opacity-50 mb-1">Cafe ERP</p>
                <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight">Orders</h1>
                <p class="text-sm opacity-50 mt-1">Track, update, and serve customer orders.</p>
            </div>
            <a th:href="@{/orders/new}" class="btn-primary px-5 py-3 text-sm font-semibold">
                New Order
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </a>
        </div>
    </section>

    <!-- Orders table -->
    <section class="stat-card p-6 sm:p-8">
        <div class="uk-overflow-auto">
            <table class="uk-table uk-table-middle">
                <thead>
                <tr>
                    <th>Order ID</th>
                    <th>Date/Time</th>
                    <th>Items</th>
                    <th>Total Amount</th>
                    <th>#</th>
                    <th>Status</th>
                    <th></th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(orders)}">
                    <td colspan="8" class="uk-text-center uk-text-muted">No orders yet.</td>
                </tr>
                <tr th:each="order : ${orders}">
                    <td th:text="${order.id}">1</td>
                    <td th:text="${#temporals.format(order.createdAt, 'yyyy-MM-dd HH:mm')}">2026-07-04 08:00</td>
                    <td>
                        <ul class="uk-list uk-list-small uk-margin-remove">
                            <li th:each="item : ${order.items}" th:text="${item.itemName + ' x' + item.quantity}">
                                Latte x 2
                            </li>
                        </ul>
                    </td>
                    <td th:text="${#numbers.formatDecimal(order.totalAmount, 1, 2)}">0.00</td>
                    <td th:text="${order.itemCount}">0</td>
                    <td>
                        <span class="pill"
                              th:classappend="${order.status.name() == 'PENDING' || order.status.name() == 'PREPARING'} ? 'pill-warn' : 'pill-ok'"
                              th:text="${order.status}">PENDING</span>
                    </td>
                    <td>
                        <form th:action="@{/orders/{id}/status(id=${order.id})}" method="post" class="uk-form-inline">
                            <select name="status" class="uk-select uk-form-small uk-width-auto">
                                <option th:each="s : ${statuses}" th:value="${s.name()}" th:text="${s.name()}" th:selected="${s == order.status}"></option>
                            </select>
                            <button type="submit" class="btn-secondary px-4 py-2 text-sm font-semibold">Update</button>
                        </form>
                    </td>
                    <td>
                        <a class="btn-secondary px-4 py-2 text-sm font-semibold" th:href="@{/orders/{id}(id=${order.id})}">View / Print</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

<div th:replace="~{fragments/layout :: assistant-widget}"></div>
</body>
</html>

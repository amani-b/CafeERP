<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Orders - Cafe ERP</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/franken-ui@2.1.2/dist/css/core.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/franken-ui@2.1.2/dist/css/utilities.min.css">
</head>
<body>
<nav th:replace="~{fragments/layout :: nav(activePage='orders')}"></nav>

<main class="uk-container uk-margin-top">
    <div class="uk-flex uk-flex-between uk-margin-bottom">
        <h1 class="uk-h2 uk-margin-remove">Orders</h1>
        <a class="uk-button uk-button-primary" th:href="@{/orders/new}">New Order</a>
    </div>

    <div class="uk-overflow-auto">
        <table class="uk-table uk-table-striped uk-table-middle">
            <thead>
            <tr>
                <th>Order ID</th>
                <th>Date/Time</th>
                <th>Items</th>
                <th>Total Amount</th>
                <th>#</th>
                <th>Status</th>
                <th></th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(orders)}">
                <td colspan="8" class="uk-text-center uk-text-muted">No orders yet.</td>
            </tr>
            <tr th:each="order : ${orders}">
                <td th:text="${order.id}">1</td>
                <td th:text="${#temporals.format(order.createdAt, 'yyyy-MM-dd HH:mm')}">2026-07-04 08:00</td>
                <td>
                    <ul class="uk-list uk-list-small uk-margin-remove">
                        <li th:each="item : ${order.items}" th:text="${item.itemName + ' x' + item.quantity}">
                            Latte x 2
                        </li>
                    </ul>
                </td>
                <td th:text="${#numbers.formatDecimal(order.totalAmount, 1, 2)}">0.00</td>
                <td th:text="${order.itemCount}">0</td>
                <td>
                    <span class="uk-label" th:text="${order.status}">PENDING</span>
                </td>
                <td>
                    <form th:action="@{/orders/{id}/status(id=${order.id})}" method="post" class="uk-form-inline">
                        <select name="status" class="uk-select uk-form-small uk-width-auto">
                            <option th:each="s : ${statuses}" th:value="${s.name()}" th:text="${s.name()}" th:selected="${s == order.status}"></option>
                        </select>
                        <button type="submit" class="uk-button uk-button-default uk-button-small">Update</button>
                    </form>
                </td>
                <td>
                    <a class="uk-button uk-button-default uk-button-small" th:href="@{/orders/{id}(id=${order.id})}">View / Print</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<div th:replace="~{fragments/layout :: assistant-widget}"></div>
</body>
</html>

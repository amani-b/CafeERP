<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'Receipt #' + ${order.id} + ' - Cafe ERP'">Receipt - Cafe ERP</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/franken-ui@2.1.2/dist/css/core.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/franken-ui@2.1.2/dist/css/utilities.min.css">
    <style>
        @media print {
            .no-print { display: none !important; }
        }
        .receipt-container { max-width: 600px; }
    </style>
</head>
<body>
<nav th:replace="~{fragments/layout :: nav(activePage='orders')}" class="no-print"></nav>

<main class="uk-container uk-margin-top receipt-container">
    <div class="no-print uk-margin-bottom">
        <a class="uk-button uk-button-default" th:href="@{/orders}">&larr; Back to Orders</a>
        <button class="uk-button uk-button-primary" onclick="window.print()">Print</button>
    </div>

    <div class="uk-card uk-card-default uk-card-body">
        <h2 class="uk-card-title uk-margin-remove-bottom">Receipt</h2>
        <p class="uk-text-muted uk-margin-remove-top">
            <span th:text="'Order #' + ${order.id}">Order #1</span>
        </p>
        <p class="uk-text-muted">
            <span th:text="${#temporals.format(order.createdAt, 'yyyy-MM-dd HH:mm')}">2026-07-04 08:00</span>
        </p>

        <hr class="uk-divider-icon">

        <table class="uk-table uk-table-small">
            <thead>
            <tr>
                <th>Item</th>
                <th class="uk-text-center">Qty</th>
                <th class="uk-text-right">Unit Price</th>
                <th class="uk-text-right">Subtotal</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${order.items}">
                <td th:text="${item.itemName}">Latte</td>
                <td class="uk-text-center" th:text="${item.quantity}">2</td>
                <td class="uk-text-right" th:text="${#numbers.formatDecimal(item.unitPrice, 1, 2)}">3.50</td>
                <td class="uk-text-right" th:text="${#numbers.formatDecimal(item.subtotal, 1, 2)}">7.00</td>
            </tr>
            </tbody>
        </table>

        <hr class="uk-divider-icon">

        <div class="uk-grid-small" uk-grid>
            <div class="uk-width-1-2"><strong>Items:</strong></div>
            <div class="uk-width-1-2 uk-text-right" th:text="${order.itemCount}">3</div>
        </div>
        <div class="uk-grid-small" uk-grid>
            <div class="uk-width-1-2"><strong>Total:</strong></div>
            <div class="uk-width-1-2 uk-text-right" th:text="${#numbers.formatDecimal(order.totalAmount, 1, 2)}">10.50</div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: assistant-widget}"></div>
</body>
</html>

<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head(title='Receipt #' + ${order.id})}"></head>
<body class="authenticated">
<div th:replace="~{fragments/layout :: sidebar(activePage='orders')}"></div>
<div th:replace="~{fragments/layout :: mobile-header}"></div>
<div th:replace="~{fragments/layout :: mobile-nav(activePage='orders')}"></div>

<main class="uk-container uk-margin-top receipt-container app-main" style="max-width:32rem;">
    <div class="no-print uk-margin-bottom flex flex-wrap items-center gap-3">
        <a class="btn btn-secondary px-4 text-sm" th:href="@{/orders}"><span class="btn-label">&larr; Back to Orders</span></a>
        <button class="btn btn-primary px-4 text-sm" onclick="window.print()"><span class="btn-label">Print</span></button>
    </div>

    <div class="card card-pad">
        <h2 class="text-xl font-extrabold tracking-tight uk-margin-remove-bottom">Receipt</h2>
        <p class="text-sm text-muted uk-margin-remove-top num">
            <span th:text="'Order #' + ${order.id}">Order #1</span>
        </p>
        <p class="text-sm text-muted num">
            <span th:text="${timeFmt.format(order.createdAt, 'yyyy-MM-dd h:mm a')}">2026-07-04 11:00 AM</span>
        </p>

        <hr class="uk-divider-icon">

        <table class="uk-table uk-table-small">
            <thead>
            <tr>
                <th>Item</th>
                <th class="uk-text-center">Qty</th>
                <th class="uk-text-right">Unit Price</th>
                <th class="uk-text-right">Subtotal</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${order.items}">
                <td th:text="${item.itemName}">Latte</td>
                <td class="uk-text-center num" th:text="${item.quantity}">2</td>
                <td class="uk-text-right num" th:text="${#numbers.formatDecimal(item.unitPrice, 1, 2)}">3.50</td>
                <td class="uk-text-right num" th:text="${#numbers.formatDecimal(item.subtotal, 1, 2)}">7.00</td>
            </tr>
            </tbody>
        </table>

        <hr class="uk-divider-icon">

        <div class="flex items-center justify-between py-2 border-t border-dashed" style="border-color: var(--line);">
            <strong>Items:</strong>
            <span class="num" th:text="${order.itemCount}">3</span>
        </div>
        <div class="flex items-center justify-between py-2 border-b border-dashed" style="border-color: var(--line);">
            <strong>Total:</strong>
            <span class="num font-extrabold" th:text="${#numbers.formatDecimal(order.totalAmount, 1, 2)}">10.50</span>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: assistant-widget}"></div>
</body>
</html>

<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head(title='Users')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav(activePage='users')}"></nav>

<main class="uk-container max-w-7xl mx-auto px-4 py-8">
    <section class="page-header card-pad mb-8">
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
            <div>
                <p class="eyebrow text-sm font-medium uppercase tracking-wider mb-1">Cafe ERP</p>
                <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight">Users</h1>
                <p class="subtitle text-sm mt-1">Manage user accounts and role assignments.</p>
            </div>
            <a th:href="@{/users/new}" class="btn btn-primary px-5 text-sm" style="background:#fff;color:var(--ink);border-color:#fff;">
                <span class="btn-label">New User</span>
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </a>
        </div>
    </section>

    <section class="card card-pad">
        <div th:if="${#lists.isEmpty(users)}" class="empty-state">
            <div class="icon-tile">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            </div>
            <h3>No users yet</h3>
            <p>Create the first staff account to get started.</p>
            <a th:href="@{/users/new}" class="btn btn-primary px-5 text-sm mt-4"><span class="btn-label">Add a user</span></a>
        </div>
        <div class="table-wrap" th:unless="${#lists.isEmpty(users)}">
            <table class="uk-table uk-table-middle">
                <thead>
                <tr>
                    <th>Username</th>
                    <th>Role</th>
                    <th>Password Status</th>
                    <th class="uk-text-right">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="user : ${users}">
                    <td class="font-semibold" th:text="${user.username}">admin</td>
                    <td>
                        <span class="badge badge-ink" th:if="${user.role.name() == 'ADMIN'}">Admin</span>
                        <span class="badge badge-neutral" th:if="${user.role.name() == 'STAFF'}">Staff</span>
                        <span class="badge badge-info" th:if="${user.role.name() == 'KITCHEN'}">Kitchen</span>
                    </td>
                    <td>
                        <span class="badge badge-warn" th:if="${user.mustChangePassword}">Must change</span>
                        <span class="badge badge-success" th:unless="${user.mustChangePassword}">Set</span>
                    </td>
                    <td class="uk-text-right">
                        <a class="btn btn-secondary px-4 text-sm" th:href="@{/users/edit/{id}(id=${user.id})}"><span class="btn-label">Edit</span></a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

<div th:replace="~{fragments/layout :: assistant-widget}"></div>
</body>
</html>

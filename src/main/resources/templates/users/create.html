<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head(title='New User')}"></head>
<body class="authenticated">
<div th:replace="~{fragments/layout :: sidebar(activePage='users')}"></div>
<div th:replace="~{fragments/layout :: mobile-header}"></div>
<div th:replace="~{fragments/layout :: mobile-nav(activePage='users')}"></div>

<main class="app-main uk-container max-w-7xl mx-auto px-4 py-8">
    <section class="page-header card-pad mb-8">
        <div>
            <p class="eyebrow text-sm font-medium uppercase tracking-wider mb-1">Cafe ERP</p>
            <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight">New User</h1>
            <p class="subtitle text-sm mt-1">Create a new user account and assign a role.</p>
        </div>
    </section>

    <section class="card card-pad">
        <form th:action="@{/users}" th:object="${user}" method="post" class="uk-width-1-2@m">
            <div class="mb-4">
                <label for="username" class="field-label">Username</label>
                <input type="text" id="username" class="uk-input w-full" th:field="*{username}" placeholder="e.g. barista"
                       th:classappend="${#fields.hasErrors('username')} ? 'uk-form-danger'">
                <div class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}">Username is required</div>
            </div>

            <div class="mb-4">
                <label for="password" class="field-label">Password</label>
                <input type="password" id="password" class="uk-input w-full" th:field="*{password}" placeholder="At least 8 characters"
                       th:classappend="${#fields.hasErrors('password')} ? 'uk-form-danger'">
                <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Password must be at least 8 characters long</div>
            </div>

            <div class="mb-4">
                <label for="role" class="field-label">Role</label>
                <select id="role" class="uk-select w-full" th:field="*{role}"
                        th:classappend="${#fields.hasErrors('role')} ? 'uk-form-danger'">
                    <option value="">Select role</option>
                    <option value="ADMIN">Admin</option>
                    <option value="STAFF">Staff</option>
                    <option value="KITCHEN">Kitchen</option>
                </select>
                <div class="field-error" th:if="${#fields.hasErrors('role')}" th:errors="*{role}">Role is required</div>
            </div>

            <div class="mb-6">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" class="uk-checkbox" th:field="*{mustChangePassword}">
                    <span class="text-sm">Force password change on first login</span>
                </label>
            </div>

            <!-- Phase 3: granular admin permissions. Nothing granted by default
                 — explicit opt-in per module. Server-side grant validation in
                 UserController (scoped admins can never grant beyond what they
                 hold; only super admin can grant the AI capabilities). -->
            <div class="mb-6" id="permissions-block" th:if="${not #lists.isEmpty(grantablePermissions)}">
                <span class="field-label">Module access <span class="text-xs font-normal" style="color:var(--muted);">(Admin role only)</span></span>
                <p class="text-sm mt-1 mb-3" style="color:var(--muted);">
                    Choose exactly which parts of the ERP this admin can access. Nothing is granted by default.
                </p>
                <div class="grid sm:grid-cols-2 gap-x-6 gap-y-2">
                    <label class="flex items-center gap-2 cursor-pointer" th:each="p : ${grantablePermissions}">
                        <input type="checkbox" class="uk-checkbox" name="permissions" th:value="${p.name()}"
                               th:checked="${selectedPermissions.contains(p)}">
                        <span class="text-sm" th:text="${p.label}">Inventory</span>
                    </label>
                </div>
                <div class="field-error mt-2" th:if="${#fields.hasGlobalErrors()}" th:each="err : ${#fields.globalErrors()}" th:text="${err}">Permission error</div>
            </div>

            <script>
                /* Show the permission grid only for the Admin role (no animation,
                   so prefers-reduced-motion is irrelevant). */
                (function () {
                    var role = document.getElementById('role');
                    var block = document.getElementById('permissions-block');
                    if (!role || !block) return;
                    function sync() { block.style.display = role.value === 'ADMIN' ? '' : 'none'; }
                    role.addEventListener('change', sync);
                    sync();
                })();
            </script>

            <div class="flex flex-wrap items-center gap-3">
                <button type="submit" class="btn btn-primary px-5 text-sm"><span class="btn-label">Save</span></button>
                <a class="btn btn-secondary px-5 text-sm" th:href="@{/users}"><span class="btn-label">Cancel</span></a>
            </div>
        </form>
    </section>
</main>

<div th:replace="~{fragments/layout :: assistant-widget}"></div>
</body>
</html>

<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inventory - Cafe ERP</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/franken-ui@2.1.2/dist/css/core.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/franken-ui@2.1.2/dist/css/utilities.min.css">
</head>
<body>
<nav th:replace="~{fragments/layout :: nav(activePage='inventory')}"></nav>

<main class="uk-container uk-margin-top">
    <div class="uk-flex uk-flex-between uk-margin-bottom">
        <h1 class="uk-h2 uk-margin-remove">Inventory</h1>
    </div>

    <div class="uk-overflow-auto">
        <table class="uk-table uk-table-striped uk-table-middle">
            <thead>
            <tr>
                <th>Menu Item</th>
                <th>Category</th>
                <th>Track</th>
                <th>Stock</th>
                <th>Low Stock Threshold</th>
                <th>Last Updated</th>
                <th class="uk-text-right">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(inventoryList)}">
                <td colspan="7" class="uk-text-center uk-text-muted">No inventory records yet.</td>
            </tr>
            <tr th:each="inv : ${inventoryList}"
                th:classappend="${inv.trackInventory && inv.stockQuantity <= inv.lowStockThreshold} ? 'uk-table-warning' : ''">
                <td th:text="${inv.menuItem.name}">Cappuccino</td>
                <td th:text="${inv.menuItem.category.name}">Beverages</td>
                <td>
                    <span class="uk-label uk-label-success" th:if="${inv.trackInventory}">On</span>
                    <span class="uk-label" th:unless="${inv.trackInventory}">Off</span>
                    <span class="uk-label uk-label-warning" th:if="${inv.trackInventory && inv.stockQuantity <= inv.lowStockThreshold}">Low Stock</span>
                </td>
                <td th:text="${inv.stockQuantity}">10</td>
                <td th:text="${inv.lowStockThreshold}">5</td>
                <td th:text="${inv.lastUpdatedAt != null ? #temporals.format(inv.lastUpdatedAt, 'yyyy-MM-dd HH:mm') : '—'}">2026-07-14 18:00</td>
                <td class="uk-text-right">
                    <button class="uk-button uk-button-default uk-button-small" type="button"
                            uk-toggle="target: #edit-${inv.id}">
                        Edit
                    </button>
                </td>
            </tr>
            <tr th:each="inv : ${inventoryList}">
                <td colspan="7" class="uk-padding-remove uk-padding-remove">
                    <div id="edit-${inv.id}" hidden>
                        <div class="uk-card uk-card-body uk-card-default uk-margin-small">
                            <form th:action="@{/inventory/update/{id}(id=${inv.id})}" method="post" class="uk-grid-small" uk-grid>
                                <div class="uk-width-auto">
                                    <label class="uk-form-label uk-text-small">Track Inventory</label>
                                    <select name="trackInventory" class="uk-select uk-form-small">
                                        <option value="true" th:selected="${inv.trackInventory}">On</option>
                                        <option value="false" th:selected="${!inv.trackInventory}">Off</option>
                                    </select>
                                </div>
                                <div class="uk-width-auto">
                                    <label class="uk-form-label uk-text-small">Stock Quantity</label>
                                    <input type="number" name="stockQuantity" class="uk-input uk-form-small"
                                           th:value="${inv.stockQuantity}" min="0" required>
                                </div>
                                <div class="uk-width-auto">
                                    <label class="uk-form-label uk-text-small">Low Stock Threshold</label>
                                    <input type="number" name="lowStockThreshold" class="uk-input uk-form-small"
                                           th:value="${inv.lowStockThreshold}" min="0" required>
                                </div>
                                <div class="uk-width-auto uk-flex uk-flex-bottom">
                                    <button type="submit" class="uk-button uk-button-primary uk-button-small">Save</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<div th:replace="~{fragments/layout :: assistant-widget}"></div>
</body>
</html>

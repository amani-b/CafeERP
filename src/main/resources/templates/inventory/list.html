<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inventory - Cafe ERP</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/franken-ui@2.1.2/dist/css/core.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/franken-ui@2.1.2/dist/css/utilities.min.css">
    <script src="https://cdn.jsdelivr.net/npm/franken-ui@2.1.2/dist/js/core.iife.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* ─── Base ─────────────────────────────────────────────── */
        /* All interactive/color styling lives in raw CSS because
           Franken UI v2.1.2 utilities.min.css exposes only semantic
           token colors (bg-background, text-foreground, etc.) and
           no shadow/transition/transform utilities.               */
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #f3f4f6; /* gray-100 */
            color: #111827;            /* gray-900 */
        }

        /* ─── Page header ──────────────────────────────────────── */
        .dash-hero {
            background: linear-gradient(135deg, #111827 0%, #1f2937 55%, #374151 100%);
            color: #fff;
            border-radius: 1.25rem;
        }

        /* ─── Card style ───────────────────────────────────────── */
        .stat-card {
            background: #ffffff;
            border: 1px solid #e5e7eb; /* gray-200 */
            border-radius: 1.25rem;
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
                        box-shadow 0.25s ease;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }
        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px -8px rgba(0, 0, 0, 0.18);
        }

        /* ─── Bouncy button (consistent with menu/orders/home) ── */
        .btn-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background-color: #111827; /* gray-900 */
            color: #ffffff;
            border: none;
            cursor: pointer;
            border-radius: 0.75rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -2px rgba(0, 0, 0, 0.2);
            transform: translateY(-1px);
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
                        background-color 0.25s ease,
                        box-shadow 0.25s ease;
        }
        .btn-primary:hover {
            background-color: #374151; /* gray-700 */
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4), 0 4px 6px -4px rgba(0, 0, 0, 0.2);
        }
        .btn-primary:active {
            transform: translateY(0) scale(0.95);
            box-shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.3);
            transition: transform 0.08s ease;
        }
        .btn-primary:focus-visible {
            outline: none;
            box-shadow: 0 0 0 2px #ffffff, 0 0 0 4px #6b7280;
        }

        /* ─── Secondary button ─────────────────────────────────── */
        .btn-secondary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background-color: #ffffff;
            color: #111827;
            border: 1px solid #e5e7eb; /* gray-200 */
            cursor: pointer;
            border-radius: 0.75rem;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
                        background-color 0.25s ease,
                        box-shadow 0.25s ease;
        }
        .btn-secondary:hover {
            background-color: #f9fafb; /* gray-50 */
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
        }
        .btn-secondary:active {
            transform: translateY(0) scale(0.97);
            transition: transform 0.08s ease;
        }
        .btn-secondary:focus-visible {
            outline: none;
            box-shadow: 0 0 0 2px #ffffff, 0 0 0 4px #6b7280;
        }

        /* ─── Status pill ─────────────────────────────────────── */
        .pill {
            display: inline-flex;
            align-items: center;
            gap: 0.375rem;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .pill-warn {
            background-color: #fef3c7; /* yellow-100 */
            color: #92400e;            /* yellow-800 */
            border: 1px solid #fde68a; /* yellow-200 */
        }
        .pill-ok {
            background-color: #dcfce7; /* green-100 */
            color: #166534;            /* green-800 */
            border: 1px solid #bbf7d0; /* green-200 */
        }
        .pill-danger {
            background-color: #fee2e2; /* red-100 */
            color: #991b1b;            /* red-800 */
            border: 1px solid #fecaca; /* red-200 */
        }
        .pill-muted {
            background-color: #f3f4f6; /* gray-100 */
            color: #374151;            /* gray-700 */
            border: 1px solid #e5e7eb; /* gray-200 */
        }

        /* ─── Low-stock row highlight ──────────────────────────── */
        .row-low-stock {
            background-color: #fffbeb; /* amber-50 */
        }
        .row-low-stock:hover {
            background-color: #fef3c7; /* amber-100 */
        }

        /* ─── Stock-level indicator bar ───────────────────────── */
        .stock-bar-track {
            height: 6px;
            max-width: 8rem;
            background-color: #e5e7eb; /* gray-200 */
            border-radius: 9999px;
            overflow: hidden;
            margin-top: 0.25rem;
        }
        .stock-bar-fill {
            height: 100%;
            border-radius: 9999px;
            transition: width 0.3s ease;
        }
        .stock-bar-fill.fill-ok {
            background-color: #22c55e; /* green-500 */
        }
        .stock-bar-fill.fill-warn {
            background-color: #f59e0b; /* amber-500 */
        }

        /* ─── Inline edit form ─────────────────────────────────── */
        .edit-form-row {
            background-color: #f9fafb; /* gray-50 */
        }
    </style>
</head>
<body>
<nav th:replace="~{fragments/layout :: nav(activePage='inventory')}"></nav>

<main class="uk-container max-w-7xl mx-auto px-4 py-8">
    <!-- Page header -->
    <section class="dash-hero p-6 sm:p-8 mb-8">
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
            <div>
                <p class="text-sm font-medium uppercase tracking-wider opacity-50 mb-1">Cafe ERP</p>
                <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight">Inventory</h1>
                <p class="text-sm opacity-50 mt-1">Live stock levels, thresholds, and reorder alerts for every menu item.</p>
            </div>
        </div>
    </section>

    <!-- Inventory table -->
    <section class="stat-card p-6 sm:p-8">
        <div class="uk-overflow-auto">
            <table class="uk-table uk-table-middle">
                <thead>
                <tr>
                    <th>Menu Item</th>
                    <th>Category</th>
                    <th>Track</th>
                    <th>Stock</th>
                    <th>Low Stock Threshold</th>
                    <th>Status</th>
                    <th>Last Updated</th>
                    <th class="uk-text-right">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(inventoryList)}">
                    <td colspan="8" class="uk-text-center uk-text-muted">No inventory records yet.</td>
                </tr>
                <th:block th:each="inv : ${inventoryList}">
                    <!-- Data row -->
                    <tr th:classappend="${inv.trackInventory && inv.stockQuantity <= inv.lowStockThreshold} ? 'row-low-stock' : ''">
                        <td class="font-semibold" th:text="${inv.menuItem.name}">Cappuccino</td>
                        <td class="text-sm text-muted-foreground" th:text="${inv.menuItem.category.name}">Beverages</td>
                        <td>
                            <span class="pill pill-ok" th:if="${inv.trackInventory}">On</span>
                            <span class="pill pill-muted" th:unless="${inv.trackInventory}">Off</span>
                        </td>
                        <td>
                            <span class="font-bold" th:text="${inv.stockQuantity}">10</span>
                            <!-- Scannable stock-level bar: width = stock ÷ threshold, capped at 100% -->
                            <div class="stock-bar-track" th:if="${inv.trackInventory}">
                                <div class="stock-bar-fill"
                                     th:classappend="${inv.stockQuantity <= inv.lowStockThreshold} ? 'fill-warn' : 'fill-ok'"
                                     th:style="'width: ' + (${inv.lowStockThreshold == 0 ? 100 : (inv.stockQuantity >= inv.lowStockThreshold ? 100 : inv.stockQuantity * 100 / inv.lowStockThreshold)}) + '%'"></div>
                            </div>
                        </td>
                        <td class="text-sm font-medium" th:text="${inv.lowStockThreshold}">5</td>
                        <td>
                            <span class="pill pill-danger" th:if="${inv.trackInventory && inv.stockQuantity <= 0}">Out of Stock</span>
                            <span class="pill pill-warn" th:if="${inv.trackInventory && inv.stockQuantity > 0 && inv.stockQuantity <= inv.lowStockThreshold}">Low Stock</span>
                            <span class="pill pill-ok" th:if="${inv.trackInventory && inv.stockQuantity > inv.lowStockThreshold}">In Stock</span>
                            <span class="pill pill-muted" th:unless="${inv.trackInventory}">Not Tracking</span>
                        </td>
                        <td th:text="${inv.lastUpdatedAt != null ? #temporals.format(inv.lastUpdatedAt, 'yyyy-MM-dd HH:mm') : '—'}" class="text-sm">2026-07-14 18:00</td>
                        <td class="uk-text-right">
                            <button class="btn-secondary px-4 py-2 text-sm font-semibold" type="button"
                                    data-edit-toggle th:attr="data-edit-target='edit-${inv.id}'">
                                Edit
                            </button>
                        </td>
                    </tr>
                    <!-- Inline edit row -->
                    <tr class="edit-form-row">
                        <td colspan="8" class="uk-padding-remove">
                            <div th:id="'edit-' + ${inv.id}" hidden>
                                <div class="uk-card uk-card-body uk-card-default uk-margin-small">
                                    <form th:action="@{/inventory/update/{id}(id=${inv.id})}" method="post" class="uk-grid-small" uk-grid>
                                        <div class="uk-width-auto">
                                            <label class="uk-form-label uk-text-small">Track Inventory</label>
                                            <select name="trackInventory" class="uk-select uk-form-small">
                                                <option value="true" th:selected="${inv.trackInventory}">On</option>
                                                <option value="false" th:selected="${!inv.trackInventory}">Off</option>
                                            </select>
                                        </div>
                                        <div class="uk-width-auto">
                                            <label class="uk-form-label uk-text-small">Stock Quantity</label>
                                            <input type="number" name="stockQuantity" class="uk-input uk-form-small"
                                                   th:value="${inv.stockQuantity}" min="0" required>
                                        </div>
                                        <div class="uk-width-auto">
                                            <label class="uk-form-label uk-text-small">Low Stock Threshold</label>
                                            <input type="number" name="lowStockThreshold" class="uk-input uk-form-small"
                                                   th:value="${inv.lowStockThreshold}" min="0" required>
                                        </div>
                                        <div class="uk-width-auto uk-flex uk-flex-bottom">
                                            <button type="submit" class="btn-primary px-4 py-2 text-sm font-semibold">Save</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </td>
                    </tr>
                </th:block>
                </tbody>
            </table>
        </div>
    </section>
</main>

<div th:replace="~{fragments/layout :: assistant-widget}"></div>

<!-- Inline edit toggle: vanilla JS since Franken UI v2.1.2 ships no uk-toggle
     handler (the literal "uk-toggle" is absent from core.iife.js). Mirrors the
     vanilla-JS pattern used for the mobile nav drawer in fragments/layout.html. -->
<script>
    (function () {
        var toggles = document.querySelectorAll('[data-edit-toggle]');
        toggles.forEach(function (btn) {
            btn.addEventListener('click', function () {
                var targetId = btn.getAttribute('data-edit-target');
                if (!targetId) return;
                var target = document.getElementById(targetId);
                if (target) {
                    target.hidden = !target.hidden;
                }
            });
        });
    })();
</script>
</body>
</html>

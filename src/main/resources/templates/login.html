<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='Login')}"></head>
<body>
<main class="flex items-center justify-center p-4" style="min-height:100vh;background:var(--surface);">

    <div class="w-full" style="max-width:26rem;">
        <div class="card" style="overflow:hidden;">
            <!-- Solid ink accent bar — the same graphic move as every
                 page header, so login feels like part of the same app
                 rather than a separate marketing skin. -->
            <div style="height:4px;background:var(--ink);"></div>

            <div class="card-pad">
                <!-- Logo / Brand -->
                <div class="flex flex-col items-center mb-8">
                    <div class="icon-tile icon-tile--ink mb-4" style="width:3.5rem;height:3.5rem;border-radius:var(--radius-lg);">
                        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17 8h1a4 4 0 1 1 0 8h-1"/>
                            <path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/>
                            <line x1="6" y1="2" x2="6" y2="4"/>
                            <line x1="10" y1="2" x2="10" y2="4"/>
                            <line x1="14" y1="2" x2="14" y2="4"/>
                        </svg>
                    </div>
                    <a class="text-xl font-extrabold tracking-tight" th:href="@{/}" style="color:var(--ink);">Cafe ERP</a>
                    <p class="text-sm mt-1 text-muted">Sign in to your account</p>
                </div>

                <!-- Error Alert -->
                <div class="alert alert-danger mb-4" th:if="${loginError}">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                    <p class="m-0">Invalid username or password.</p>
                </div>

                <!-- Logout Alert -->
                <div class="alert alert-info mb-4" th:if="${param.logout}">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12l2 2 4-4"/><path d="M21 12c0 4.97-4.03 9-9 9s-9-4.03-9-9 4.03-9 9-9 9 4.03 9 9z"/></svg>
                    <p class="m-0">You have been logged out.</p>
                </div>

                <!-- Login Form -->
                <form th:action="@{/login}" method="post">
                    <div class="mb-4">
                        <label for="username" class="field-label">Username</label>
                        <input type="text" id="username" name="username" class="uk-input w-full"
                               placeholder="Enter your username" required autofocus>
                    </div>
                    <div class="mb-6">
                        <label for="password" class="field-label">Password</label>
                        <div class="password-input-wrapper" style="position: relative;">
                            <input type="password" id="password" name="password" class="uk-input w-full"
                                   placeholder="Enter your password" required style="padding-right: 2.5rem;">
                            <button type="button" id="toggle-login-password" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: inherit;" aria-label="Toggle password visibility">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-icon"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-off-icon" style="display: none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-full text-sm">
                        <span class="btn-label">Sign in</span>
                        <span class="btn-spinner" aria-hidden="true"></span>
                    </button>
                </form>
            </div>
        </div>

        <p class="text-center text-xs mt-6 text-muted-2">&copy; Cafe ERP &middot; Café Management System</p>
    </div>
</main>
</body>
</html>

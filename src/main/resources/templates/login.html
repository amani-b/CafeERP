<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Cafe ERP</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/franken-ui@2.1.2/dist/css/core.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/franken-ui@2.1.2/dist/css/utilities.min.css">
</head>
<body>
<nav class="uk-navbar-container" uk-navbar>
    <div class="uk-container uk-container-expand">
        <div class="uk-navbar-left">
            <a class="uk-navbar-item uk-logo" th:href="@{/}">Cafe ERP</a>
        </div>
    </div>
</nav>

<main class="uk-container uk-margin-top">
    <div class="uk-flex uk-flex-center">
        <div class="uk-width-large">
            <h1 class="uk-h2 uk-text-center">Login</h1>
            <div class="uk-alert-danger" uk-alert th:if="${loginError}">
                <a class="uk-alert-close" uk-close></a>
                <p>Invalid username or password.</p>
            </div>
            <div class="uk-alert-primary" uk-alert th:if="${param.logout}">
                <a class="uk-alert-close" uk-close></a>
                <p>You have been logged out.</p>
            </div>
            <form th:action="@{/login}" method="post" class="uk-form-stacked">
                <div class="uk-margin">
                    <label for="username" class="uk-form-label">Username</label>
                    <div class="uk-form-controls">
                        <input type="text" id="username" name="username" class="uk-input" required autofocus>
                    </div>
                </div>
                <div class="uk-margin">
                    <label for="password" class="uk-form-label">Password</label>
                    <div class="uk-form-controls">
                        <input type="password" id="password" name="password" class="uk-input" required>
                    </div>
                </div>
                <button type="submit" class="uk-button uk-button-primary uk-width-1-1">Sign in</button>
            </form>
        </div>
    </div>
</main>
</body>
</html>

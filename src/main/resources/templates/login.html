<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Cafe ERP</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/franken-ui@2.1.2/dist/css/core.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/franken-ui@2.1.2/dist/css/utilities.min.css">
    <script src="https://cdn.jsdelivr.net/npm/franken-ui@2.1.2/dist/js/core.iife.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        .btn-submit {
            background-color: #000000;
            color: #ffffff;
        }
        .btn-submit:hover {
            background-color: #374151; /* gray-800 equivalent */
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-stone-900 via-amber-950 to-stone-900 flex items-center justify-center p-4 relative overflow-hidden">

    <!-- Decorative background blobs -->
    <div class="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] bg-amber-600/20 rounded-full blur-3xl"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[500px] h-[500px] bg-orange-700/15 rounded-full blur-3xl"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[300px] h-[300px] bg-amber-500/10 rounded-full blur-3xl"></div>

    <!-- Login Card -->
    <div class="relative w-full max-w-md bg-white/95 backdrop-blur-2xl rounded-3xl shadow-2xl border border-white/20 overflow-hidden">

        <!-- Top gradient accent bar -->
        <div class="h-2 bg-gradient-to-r from-amber-500 via-amber-600 to-amber-700"></div>

        <div class="p-8 sm:p-10">
            <!-- Logo / Brand -->
            <div class="flex flex-col items-center mb-8">
                <div class="w-16 h-16 bg-gradient-to-br from-amber-500 to-amber-700 rounded-2xl flex items-center justify-center shadow-lg shadow-amber-600/30 mb-4 transform hover:scale-105 transition-transform duration-300">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17 8h1a4 4 0 1 1 0 8h-1"/>
                        <path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/>
                        <line x1="6" y1="2" x2="6" y2="4"/>
                        <line x1="10" y1="2" x2="10" y2="4"/>
                        <line x1="14" y1="2" x2="14" y2="4"/>
                    </svg>
                </div>
                <a class="text-2xl font-bold text-stone-800 tracking-tight hover:text-amber-700 transition-colors duration-200" th:href="@{/}">Cafe ERP</a>
                <p class="text-stone-500 text-sm mt-1">Sign in to your account</p>
            </div>

            <!-- Error Alert -->
            <div class="uk-alert-danger relative mb-4 rounded-xl bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-700" uk-alert th:if="${loginError}">
                <a class="uk-alert-close" uk-close></a>
                <div class="flex items-center gap-2.5 pr-6">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="flex-shrink-0">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="12" y1="8" x2="12" y2="12"/>
                        <line x1="12" y1="16" x2="12.01" y2="16"/>
                    </svg>
                    <p class="m-0">Invalid username or password.</p>
                </div>
            </div>

            <!-- Logout Alert -->
            <div class="uk-alert-primary relative mb-4 rounded-xl bg-amber-50 border border-amber-200 px-4 py-3 text-sm text-amber-700" uk-alert th:if="${param.logout}">
                <a class="uk-alert-close" uk-close></a>
                <div class="flex items-center gap-2.5 pr-6">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="flex-shrink-0">
                        <path d="M9 12l2 2 4-4"/>
                        <path d="M21 12c0 4.97-4.03 9-9 9s-9-4.03-9-9 4.03-9 9-9 9 4.03 9 9z"/>
                    </svg>
                    <p class="m-0">You have been logged out.</p>
                </div>
            </div>

            <!-- Login Form -->
            <form th:action="@{/login}" method="post" class="space-y-5">
                <div>
                    <label for="username" class="block text-sm font-medium text-stone-700 mb-1.5">Username</label>
                    <input type="text" id="username" name="username"
                           class="w-full px-4 py-3 rounded-xl border border-stone-300 bg-stone-50 text-stone-800 placeholder-stone-400 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent transition-all duration-200"
                           placeholder="Enter your username" required autofocus>
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium text-stone-700 mb-1.5">Password</label>
                    <input type="password" id="password" name="password"
                           class="w-full px-4 py-3 rounded-xl border border-stone-300 bg-stone-50 text-stone-800 placeholder-stone-400 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent transition-all duration-200"
                           placeholder="Enter your password" required>
                </div>
                <button type="submit"
                        class="btn-submit w-full font-semibold py-3.5 px-6 rounded-xl shadow-md hover:shadow-lg transition-all duration-200 ease-in-out transform hover:scale-[1.02] active:scale-[0.98] cursor-pointer border-none focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2">
                    Sign in
                </button>
            </form>

            <!-- Footer -->
            <p class="text-center text-stone-400 text-xs mt-8">&copy; Cafe ERP &middot; Premium Cafe Management System</p>
        </div>
    </div>
</body>
</html>

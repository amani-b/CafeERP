<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Menu Item - Cafe ERP</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/franken-ui@2.1.2/dist/css/core.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/franken-ui@2.1.2/dist/css/utilities.min.css">
</head>
<body>
<nav th:replace="~{fragments/layout :: nav(activePage='menu')}"></nav>

<main class="uk-container uk-margin-top">
    <h1 class="uk-h2">Edit Menu Item</h1>

    <form th:action="@{/menu/update/{id}(id=${menuItem.id})}" th:object="${menuItem}" method="post" class="uk-width-1-2@m">
        <div class="uk-margin">
            <label for="name" class="uk-form-label">Name</label>
            <div class="uk-form-controls">
                <input type="text" id="name" class="uk-input" th:field="*{name}"
                       th:classappend="${#fields.hasErrors('name')} ? 'uk-form-danger'">
                <div class="uk-text-danger uk-text-small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Name is required</div>
            </div>
        </div>

        <div class="uk-margin">
            <label for="category" class="uk-form-label">Category</label>
            <div class="uk-form-controls">
                <select id="category" class="uk-select" th:field="*{category.id}"
                        th:classappend="${#fields.hasErrors('category')} ? 'uk-form-danger'">
                    <option value="">Select category</option>
                    <option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}">Beverages</option>
                </select>
                <div class="uk-text-danger uk-text-small" th:if="${#fields.hasErrors('category')}" th:errors="*{category}">Category is required</div>
            </div>
        </div>

        <div class="uk-margin">
            <label for="price" class="uk-form-label">Price</label>
            <div class="uk-form-controls">
                <input type="number" id="price" class="uk-input" step="0.01" min="0" th:field="*{price}"
                       th:classappend="${#fields.hasErrors('price')} ? 'uk-form-danger'">
                <div class="uk-text-danger uk-text-small" th:if="${#fields.hasErrors('price')}" th:errors="*{price}">Price is required</div>
            </div>
        </div>

        <div class="uk-margin">
            <label>
                <input type="checkbox" class="uk-checkbox" th:field="*{available}">
                <span class="uk-margin-small-left">Available</span>
            </label>
        </div>

        <button type="submit" class="uk-button uk-button-primary">Update</button>
        <a class="uk-button uk-button-default" th:href="@{/menu}">Cancel</a>
    </form>
</main>

<div th:replace="~{fragments/layout :: assistant-widget}"></div>
</body>
</html>

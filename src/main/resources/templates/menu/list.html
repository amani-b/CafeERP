<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Menu - Cafe ERP</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/franken-ui@2.1.2/dist/css/core.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/franken-ui@2.1.2/dist/css/utilities.min.css">
</head>
<body>
<nav th:replace="~{fragments/layout :: nav(activePage='menu')}"></nav>

<main class="uk-container uk-margin-top">
    <div class="uk-flex uk-flex-between uk-margin-bottom">
        <h1 class="uk-h2 uk-margin-remove">Menu</h1>
        <a class="uk-button uk-button-primary" th:href="@{/menu/new}">New Menu Item</a>
    </div>

    <div class="uk-overflow-auto">
        <table class="uk-table uk-table-striped uk-table-middle">
            <thead>
            <tr>
                <th>Name</th>
                <th>Category</th>
                <th>Price</th>
                <th>Availability</th>
                <th class="uk-text-right">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(menuItems)}">
                <td colspan="5" class="uk-text-center uk-text-muted">No menu items yet.</td>
            </tr>
            <tr th:each="menuItem : ${menuItems}">
                <td th:text="${menuItem.name}">Cappuccino</td>
                <td th:text="${menuItem.category.name}">Beverages</td>
                <td th:text="${#numbers.formatDecimal(menuItem.price, 1, 2)}">250.00</td>
                <td>
                    <span class="uk-label uk-label-success" th:if="${menuItem.available}">Available</span>
                    <span class="uk-label" th:unless="${menuItem.available}">Unavailable</span>
                    <span class="uk-label uk-label-warning" th:if="${lowStockItemIds.contains(menuItem.id)}">Low Stock</span>
                </td>
                <td class="uk-text-right">
                    <a class="uk-button uk-button-default uk-button-small" th:href="@{/menu/edit/{id}(id=${menuItem.id})}">Edit</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<div th:replace="~{fragments/layout :: assistant-widget}"></div>
</body>
</html>

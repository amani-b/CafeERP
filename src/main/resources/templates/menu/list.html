<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head(title='Menu')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav(activePage='menu')}"></nav>

<main class="uk-container max-w-7xl mx-auto px-4 py-8">
    <!-- Page header -->
    <section class="page-header card-pad mb-8">
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
            <div>
                <p class="eyebrow text-sm font-medium uppercase tracking-wider mb-1">Cafe ERP</p>
                <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight">Menu</h1>
                <p class="subtitle text-sm mt-1">Browse and manage the items offered to customers.</p>
            </div>
            <a th:href="@{/menu/new}" class="btn btn-primary px-5 text-sm" style="background:#fff;color:var(--ink);border-color:#fff;">
                <span class="btn-label">New Menu Item</span>
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </a>
        </div>
    </section>

    <!-- Menu items table -->
    <section class="card card-pad">
        <div th:if="${#lists.isEmpty(menuItems)}" class="empty-state">
            <div class="icon-tile">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
            </div>
            <h3>No menu items yet</h3>
            <p>Add your first item to start taking orders.</p>
            <a th:href="@{/menu/new}" class="btn btn-primary px-5 text-sm mt-4"><span class="btn-label">Add a menu item</span></a>
        </div>
        <div class="table-wrap" th:unless="${#lists.isEmpty(menuItems)}">
            <table class="uk-table uk-table-middle">
                <thead>
                <tr>
                    <th>Name</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Availability</th>
                    <th class="uk-text-right">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="menuItem : ${menuItems}">
                    <td class="font-semibold" th:text="${menuItem.name}">Cappuccino</td>
                    <td class="text-sm text-muted" th:text="${menuItem.category.name}">Beverages</td>
                    <td class="num" th:text="'$' + ${#numbers.formatDecimal(menuItem.price, 1, 2)}">$250.00</td>
                    <td>
                        <span class="badge badge-success" th:if="${menuItem.available}">Available</span>
                        <span class="badge badge-neutral" th:unless="${menuItem.available}">Unavailable</span>
                        <span class="badge badge-warn" th:if="${lowStockItemIds.contains(menuItem.id)}">Low Stock</span>
                    </td>
                    <td class="uk-text-right">
                        <a class="btn btn-secondary px-4 text-sm" th:href="@{/menu/edit/{id}(id=${menuItem.id})}"><span class="btn-label">Edit</span></a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

<div th:replace="~{fragments/layout :: assistant-widget}"></div>
</body>
</html>

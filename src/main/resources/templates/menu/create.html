<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head(title='New Menu Item')}"></head>
<body class="authenticated">
<div th:replace="~{fragments/layout :: sidebar(activePage='menu')}"></div>
<div th:replace="~{fragments/layout :: mobile-header}"></div>
<div th:replace="~{fragments/layout :: mobile-nav(activePage='menu')}"></div>

<main class="app-main uk-container max-w-7xl mx-auto px-4 py-8">
    <section class="page-header card-pad mb-8">
        <div>
            <p class="eyebrow text-sm font-medium uppercase tracking-wider mb-1">Cafe ERP</p>
            <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight">New Menu Item</h1>
            <p class="subtitle text-sm mt-1">Add a new item to the café menu.</p>
        </div>
    </section>

    <section class="card card-pad">
        <form th:action="@{/menu}" th:object="${menuItem}" method="post" class="uk-width-1-2@m">
            <div class="mb-4">
                <label for="name" class="field-label">Name</label>
                <input type="text" id="name" class="uk-input w-full" th:field="*{name}" placeholder="e.g. Cappuccino"
                       th:classappend="${#fields.hasErrors('name')} ? 'uk-form-danger'">
                <div class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Name is required</div>
            </div>

            <div class="mb-4">
                <label for="category" class="field-label">Category</label>
                <select id="category" class="uk-select w-full" th:field="*{category.id}"
                        th:classappend="${#fields.hasErrors('category')} ? 'uk-form-danger'">
                    <option value="">Select category</option>
                    <option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}">Beverages</option>
                </select>
                <div class="field-error" th:if="${#fields.hasErrors('category')}" th:errors="*{category}">Category is required</div>
            </div>

            <div class="mb-4">
                <label for="price" class="field-label">Price</label>
                <input type="number" id="price" class="uk-input w-full" step="0.01" min="0" th:field="*{price}"
                       placeholder="0.00" th:classappend="${#fields.hasErrors('price')} ? 'uk-form-danger'">
                <div class="field-error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}">Price is required</div>
            </div>

            <div class="mb-6">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" class="uk-checkbox" th:field="*{available}">
                    <span class="text-sm">Available</span>
                </label>
            </div>

            <div class="flex flex-wrap items-center gap-3">
                <button type="submit" class="btn btn-primary px-5 text-sm"><span class="btn-label">Save</span></button>
                <a class="btn btn-secondary px-5 text-sm" th:href="@{/menu}"><span class="btn-label">Cancel</span></a>
            </div>
        </form>
    </section>
</main>

<div th:replace="~{fragments/layout :: assistant-widget}"></div>
</body>
</html>

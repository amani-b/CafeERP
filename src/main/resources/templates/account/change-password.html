<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Change Password - Cafe ERP</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/franken-ui@2.1.2/dist/css/core.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/franken-ui@2.1.2/dist/css/utilities.min.css">
    <script src="https://cdn.jsdelivr.net/npm/franken-ui@2.1.2/dist/js/core.iife.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="min-h-screen bg-stone-50">
<nav th:replace="~{fragments/layout :: nav(activePage='account')}"></nav>

<main class="min-h-[calc(100vh-65px)] flex items-center justify-center p-4 py-10 relative overflow-hidden bg-gradient-to-br from-stone-50 via-amber-50 to-stone-100">
    <!-- Decorative background blobs -->
    <div class="absolute top-0 left-0 w-96 h-96 bg-amber-200/30 rounded-full blur-3xl"></div>
    <div class="absolute bottom-0 right-0 w-96 h-96 bg-orange-200/30 rounded-full blur-3xl"></div>

    <!-- Change Password Card -->
    <div class="relative w-full max-w-md bg-white rounded-3xl shadow-xl border border-stone-200/60 overflow-hidden">
        <!-- Top gradient accent bar -->
        <div class="h-2 bg-gradient-to-r from-amber-500 via-amber-600 to-amber-700"></div>

        <div class="p-8 sm:p-10">
            <!-- Header -->
            <div class="flex flex-col items-center mb-8">
                <div class="w-16 h-16 bg-gradient-to-br from-amber-500 to-amber-700 rounded-2xl flex items-center justify-center shadow-lg shadow-amber-600/30 mb-4 transform hover:scale-105 transition-transform duration-300">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                </div>
                <h1 class="text-2xl font-bold text-stone-800 tracking-tight">Change Password</h1>
                <p class="text-stone-500 text-sm mt-1 text-center">Update your password to keep your account secure</p>
            </div>

            <!-- Success Alert -->
            <div class="uk-alert-success relative mb-4 rounded-xl bg-green-50 border border-green-200 px-4 py-3 text-sm text-green-700" uk-alert th:if="${successMessage}" th:text="${successMessage}">
                Password changed successfully.
            </div>

            <!-- Error Alert -->
            <div class="uk-alert-danger relative mb-4 rounded-xl bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-700" uk-alert th:if="${errorMessage}" th:text="${errorMessage}">
                An error occurred.
            </div>

            <!-- Change Password Form -->
            <form th:action="@{/account/password}" method="post" class="space-y-5">
                <div>
                    <label for="currentPassword" class="block text-sm font-medium text-stone-700 mb-1.5">Current Password</label>
                    <input type="password" id="currentPassword" name="currentPassword"
                           class="w-full px-4 py-3 rounded-xl border border-stone-300 bg-stone-50 text-stone-800 placeholder-stone-400 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent transition-all duration-200"
                           placeholder="Enter current password" required>
                </div>
                <div>
                    <label for="newPassword" class="block text-sm font-medium text-stone-700 mb-1.5">New Password</label>
                    <input type="password" id="newPassword" name="newPassword"
                           class="w-full px-4 py-3 rounded-xl border border-stone-300 bg-stone-50 text-stone-800 placeholder-stone-400 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent transition-all duration-200"
                           placeholder="Enter new password" required>
                </div>
                <div>
                    <label for="confirmPassword" class="block text-sm font-medium text-stone-700 mb-1.5">Confirm New Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword"
                           class="w-full px-4 py-3 rounded-xl border border-stone-300 bg-stone-50 text-stone-800 placeholder-stone-400 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent transition-all duration-200"
                           placeholder="Confirm new password" required>
                </div>

                <!-- Password Requirements Checklist -->
                <div class="bg-stone-50 rounded-xl border border-stone-200 p-4 space-y-2.5">
                    <p class="text-xs font-semibold text-stone-500 uppercase tracking-wide">Password Requirements</p>
                    <div class="flex items-center gap-2 text-sm text-stone-400 transition-colors duration-200" id="req-length">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="flex-shrink-0">
                            <polyline points="20 6 9 17 4 12"/>
                        </svg>
                        <span>At least 8 characters</span>
                    </div>
                    <div class="flex items-center gap-2 text-sm text-stone-400 transition-colors duration-200" id="req-match">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="flex-shrink-0">
                            <polyline points="20 6 9 17 4 12"/>
                        </svg>
                        <span>Passwords match</span>
                    </div>
                </div>

                <button type="submit"
                        class="w-full bg-amber-600 hover:bg-amber-700 text-white font-semibold py-3.5 px-6 rounded-xl shadow-md hover:shadow-lg transition-all duration-200 ease-in-out transform hover:scale-[1.02] active:scale-[0.98] cursor-pointer border-none">
                    Change Password
                </button>
            </form>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: assistant-widget}"></div>

<script>
    // Password requirements live validation
    (function () {
        var newPassword = document.getElementById('newPassword');
        var confirmPassword = document.getElementById('confirmPassword');
        var reqLength = document.getElementById('req-length');
        var reqMatch = document.getElementById('req-match');

        if (!newPassword || !confirmPassword) return;

        function updateRequirements() {
            var np = newPassword.value;
            var cp = confirmPassword.value;

            // Length check
            if (np.length >= 8) {
                reqLength.classList.remove('text-stone-400');
                reqLength.classList.add('text-green-600');
            } else {
                reqLength.classList.remove('text-green-600');
                reqLength.classList.add('text-stone-400');
            }

            // Match check
            if (np.length > 0 && cp.length > 0 && np === cp) {
                reqMatch.classList.remove('text-stone-400');
                reqMatch.classList.add('text-green-600');
            } else {
                reqMatch.classList.remove('text-green-600');
                reqMatch.classList.add('text-stone-400');
            }
        }

        newPassword.addEventListener('input', updateRequirements);
        confirmPassword.addEventListener('input', updateRequirements);
    })();
</script>
</body>
</html>

<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head(title='Change Password')}"></head>
<body class="authenticated">
<div th:replace="~{fragments/layout :: sidebar(activePage='account')}"></div>
<div th:replace="~{fragments/layout :: mobile-header}"></div>
<div th:replace="~{fragments/layout :: mobile-nav(activePage='account')}"></div>

<main class="flex items-center justify-center p-4 py-10 app-main" style="min-height:calc(100vh - 60px);background:var(--surface);">
    <div class="w-full" style="max-width:26rem;">
        <div class="card" style="overflow:hidden;">
            <div style="height:4px;background:var(--ink);"></div>

            <div class="card-pad">
                <!-- Header -->
                <div class="flex flex-col items-center mb-8">
                    <div class="icon-tile icon-tile--ink mb-4" style="width:3.5rem;height:3.5rem;border-radius:var(--radius-lg);">
                        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                    </div>
                    <h1 class="text-xl font-extrabold tracking-tight" style="color:var(--ink);">Change Password</h1>
                    <p class="text-sm mt-1 text-center text-muted">Update your password to keep your account secure</p>
                </div>

                <!-- Success Alert -->
                <div class="alert alert-success mb-4" th:if="${successMessage}" th:text="${successMessage}">
                    Password changed successfully.
                </div>

                <!-- Error Alert -->
                <div class="alert alert-danger mb-4" th:if="${errorMessage}" th:text="${errorMessage}">
                    An error occurred.
                </div>

                <!-- Change Password Form -->
                <form th:action="@{/account/password}" method="post">
                    <div class="mb-4">
                        <label for="currentPassword" class="field-label">Current Password</label>
                        <div class="password-input-wrapper" style="position: relative;">
                            <input type="password" id="currentPassword" name="currentPassword" class="uk-input w-full"
                                   placeholder="Enter current password" required style="padding-right: 2.5rem;">
                            <button type="button" class="toggle-password-btn" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: inherit;" aria-label="Toggle password visibility">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-icon"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-off-icon" style="display: none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                            </button>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label for="newPassword" class="field-label">New Password</label>
                        <div class="password-input-wrapper" style="position: relative;">
                            <input type="password" id="newPassword" name="newPassword" class="uk-input w-full"
                                   placeholder="Enter new password" required style="padding-right: 2.5rem;">
                            <button type="button" class="toggle-password-btn" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: inherit;" aria-label="Toggle password visibility">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-icon"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-off-icon" style="display: none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                            </button>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label for="confirmPassword" class="field-label">Confirm New Password</label>
                        <div class="password-input-wrapper" style="position: relative;">
                            <input type="password" id="confirmPassword" name="confirmPassword" class="uk-input w-full"
                                   placeholder="Confirm new password" required style="padding-right: 2.5rem;">
                            <button type="button" class="toggle-password-btn" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: inherit;" aria-label="Toggle password visibility">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-icon"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-off-icon" style="display: none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                            </button>
                        </div>
                    </div>

                    <!-- Password Requirements Checklist -->
                    <div class="mb-6" style="background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);padding:1rem;">
                        <p class="section-label mb-2">Password Requirements</p>
                        <div class="req-row" id="req-length">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                            <span>At least 8 characters</span>
                        </div>
                        <div class="req-row mt-2" id="req-match">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                            <span>Passwords match</span>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-full text-sm">
                        <span class="btn-label">Change Password</span>
                        <span class="btn-spinner" aria-hidden="true"></span>
                    </button>
                </form>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: assistant-widget}"></div>

<script th:inline="none">
    // Password requirements live validation
    (function () {
        var newPassword = document.getElementById('newPassword');
        var confirmPassword = document.getElementById('confirmPassword');
        var reqLength = document.getElementById('req-length');
        var reqMatch = document.getElementById('req-match');

        if (!newPassword || !confirmPassword) return;

        function updateRequirements() {
            var np = newPassword.value;
            var cp = confirmPassword.value;

            reqLength.classList.toggle('met', np.length >= 8);
            reqMatch.classList.toggle('met', np.length > 0 && cp.length > 0 && np === cp);
        }

        newPassword.addEventListener('input', updateRequirements);
        confirmPassword.addEventListener('input', updateRequirements);
    })();
</script>
</body>
</html>

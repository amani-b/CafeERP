<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Change Password - Cafe ERP</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/franken-ui@2.1.2/dist/css/core.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/franken-ui@2.1.2/dist/css/utilities.min.css">
</head>
<body>
<nav th:replace="~{fragments/layout :: nav(activePage='account')}"></nav>

<main class="uk-container uk-margin-top">
    <div class="uk-flex uk-flex-center">
        <div class="uk-width-medium">
            <h1 class="uk-h2">Change Password</h1>

            <div class="uk-alert-success" uk-alert th:if="${successMessage}" th:text="${successMessage}">
                Password changed successfully.
            </div>
            <div class="uk-alert-danger" uk-alert th:if="${errorMessage}" th:text="${errorMessage}">
                An error occurred.
            </div>

            <form th:action="@{/account/password}" method="post" class="uk-form-stacked">
                <div class="uk-margin">
                    <label for="currentPassword" class="uk-form-label">Current Password</label>
                    <div class="uk-form-controls">
                        <input type="password" id="currentPassword" name="currentPassword" class="uk-input" required>
                    </div>
                </div>
                <div class="uk-margin">
                    <label for="newPassword" class="uk-form-label">New Password</label>
                    <div class="uk-form-controls">
                        <input type="password" id="newPassword" name="newPassword" class="uk-input" required>
                        <div class="uk-text-meta">At least 8 characters.</div>
                    </div>
                </div>
                <div class="uk-margin">
                    <label for="confirmPassword" class="uk-form-label">Confirm New Password</label>
                    <div class="uk-form-controls">
                        <input type="password" id="confirmPassword" name="confirmPassword" class="uk-input" required>
                    </div>
                </div>
                <button type="submit" class="uk-button uk-button-primary uk-width-1-1">Change Password</button>
            </form>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: assistant-widget}"></div>
</body>
</html>

<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cafe ERP</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/franken-ui@2.1.2/dist/css/core.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/franken-ui@2.1.2/dist/css/utilities.min.css">
</head>
<body>
<nav th:replace="~{fragments/layout :: nav(activePage='dashboard')}"></nav>

<main class="uk-container uk-margin-top">
    <h1 class="uk-h1">Dashboard</h1>

    <div sec:authorize="hasRole('ADMIN')" class="uk-child-width-1-2@m uk-grid-small uk-grid-match uk-margin-top" uk-grid>
        <div>
            <div class="uk-card uk-card-warning uk-card-body" th:if="${lowStockCount > 0}">
                <h5 class="uk-card-title">Low Stock Alert</h5>
                <p class="uk-margin-remove-top">
                    <strong th:text="${lowStockCount + ' item(s) low on stock'}">3 item(s) low on stock</strong>
                </p>
                <a th:href="@{/inventory}" class="uk-button uk-button-default uk-button-small">View Inventory</a>
            </div>
            <div class="uk-card uk-card-default uk-card-body" th:if="${lowStockCount == 0}">
                <h5 class="uk-card-title">Inventory</h5>
                <p class="uk-text-success uk-margin-remove-bottom">All items are well stocked.</p>
                <a th:href="@{/inventory}" class="uk-button uk-button-default uk-button-small uk-margin-small-top">View Inventory</a>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: assistant-widget}"></div>
</body>
</html>

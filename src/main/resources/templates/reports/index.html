<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sales Report - Cafe ERP</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/franken-ui@2.1.2/dist/css/core.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/franken-ui@2.1.2/dist/css/utilities.min.css">
</head>
<body>
<nav th:replace="~{fragments/layout :: nav(activePage='reports')}"></nav>

<main class="uk-container uk-margin-top">
    <div class="uk-flex uk-flex-between uk-margin-bottom">
        <h1 class="uk-h2 uk-margin-remove">Sales Report</h1>
    </div>

    <!-- Date range filter -->
    <div class="uk-card uk-card-default uk-card-body uk-margin-bottom">
        <form method="get" action="/reports" class="uk-grid-small" uk-grid>
            <div class="uk-width-auto">
                <span class="uk-text-bold uk-margin-small-right">Quick:</span>
                <a th:href="@{/reports(preset='today')}" class="uk-button uk-button-small"
                   th:classappend="${selectedPreset == 'today'} ? 'uk-button-primary' : 'uk-button-default'">Today</a>
                <a th:href="@{/reports(preset='week')}" class="uk-button uk-button-small"
                   th:classappend="${selectedPreset == 'week'} ? 'uk-button-primary' : 'uk-button-default'">This Week</a>
                <a th:href="@{/reports(preset='month')}" class="uk-button uk-button-small"
                   th:classappend="${selectedPreset == 'month'} ? 'uk-button-primary' : 'uk-button-default'">This Month</a>
                <a th:href="@{/reports(preset='all')}" class="uk-button uk-button-small"
                   th:classappend="${selectedPreset == 'all'} ? 'uk-button-primary' : 'uk-button-default'">All Time</a>
            </div>
            <div class="uk-width-auto">
                <label for="from" class="uk-form-label uk-invisible">From</label>
                <input type="date" id="from" name="from" class="uk-input uk-form-small"
                       th:value="${customFrom}" placeholder="From">
            </div>
            <div class="uk-width-auto">
                <label for="to" class="uk-form-label uk-invisible">To</label>
                <input type="date" id="to" name="to" class="uk-input uk-form-small"
                       th:value="${customTo}" placeholder="To">
            </div>
            <div class="uk-width-auto uk-flex uk-flex-bottom">
                <button type="submit" class="uk-button uk-button-primary uk-button-small">Apply</button>
            </div>
        </form>
    </div>

    <!-- Summary cards -->
    <div class="uk-child-width-1-2@m uk-grid-medium uk-margin-bottom" uk-grid>
        <div>
            <div class="uk-card uk-card-primary uk-card-body">
                <h5 class="uk-card-title">Total Sales</h5>
                <p class="uk-text-large uk-margin-remove-top" th:text="${#numbers.formatDecimal(report.totalSales, 1, 2)}">0.00</p>
            </div>
        </div>
        <div>
            <div class="uk-card uk-card-secondary uk-card-body">
                <h5 class="uk-card-title">Total Orders</h5>
                <p class="uk-text-large uk-margin-remove-top" th:text="${report.orderCount}">0</p>
            </div>
        </div>
    </div>

    <!-- Date range caption -->
    <p class="uk-text-muted uk-text-small uk-margin-bottom">
        Showing data from
        <strong th:text="${#temporals.format(report.from, 'yyyy-MM-dd HH:mm')}">2026-07-23 00:00</strong>
        to
        <strong th:text="${#temporals.format(report.to, 'yyyy-MM-dd HH:mm')}">2026-07-23 23:59</strong>.
    </p>

    <!-- Top 5 items -->
    <h2 class="uk-h4">Top Selling Items</h2>
    <div class="uk-overflow-auto">
        <table class="uk-table uk-table-striped uk-table-middle">
            <thead>
            <tr>
                <th>#</th>
                <th>Item Name</th>
                <th>Quantity Sold</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(report.topItems)}">
                <td colspan="3" class="uk-text-center uk-text-muted">No sales data for this period.</td>
            </tr>
            <tr th:each="item, stat : ${report.topItems}">
                <td th:text="${stat.count}">1</td>
                <td th:text="${item.itemName}">Latte</td>
                <td th:text="${item.totalQuantity}">5</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<div th:replace="~{fragments/layout :: assistant-widget}"></div>
</body>
</html>

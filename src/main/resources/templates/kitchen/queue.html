<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kitchen Queue - Cafe ERP</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/franken-ui@2.1.2/dist/css/core.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/franken-ui@2.1.2/dist/css/utilities.min.css">
    <script src="https://cdn.jsdelivr.net/npm/franken-ui@2.1.2/dist/js/core.iife.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* ─── Base ─────────────────────────────────────────────── */
        /* All interactive/color styling lives in raw CSS because
           Franken UI v2.1.2 utilities.min.css exposes only semantic
           token colors (bg-background, text-foreground, etc.) and
           no shadow/transition/transform utilities — the same
           established workaround used by Orders/Menu/Inventory/Reports. */
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #f3f4f6; /* gray-100 */
            color: #111827;            /* gray-900 */
        }

        /* ─── Page header (consistent with other pages) ─────────── */
        .dash-hero {
            background: linear-gradient(135deg, #111827 0%, #1f2937 55%, #374151 100%);
            color: #fff;
            border-radius: 1.25rem;
        }

        /* ─── Card style (consistent with other pages) ─────────── */
        .kitchen-card {
            background: #ffffff;
            border: 1px solid #e5e7eb; /* gray-200 */
            border-radius: 1.25rem;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        .kitchen-card--preparing {
            border-left: 6px solid #d97706; /* amber-600 */
        }
        .kitchen-card--ready {
            border-left: 6px solid #16a34a; /* green-600 */
        }
        .kitchen-card--pending {
            border-left: 6px solid #2563eb; /* blue-600 */
        }

        /* ─── Status pill (high-contrast, at-a-glance) ─────────── */
        .pill {
            display: inline-flex;
            align-items: center;
            gap: 0.375rem;
            padding: 0.4rem 0.9rem;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            text-transform: uppercase;
        }
        .pill-pending {
            background-color: #dbeafe; /* blue-100 */
            color: #1e40af;            /* blue-800 */
            border: 1px solid #bfdbfe; /* blue-200 */
        }
        .pill-preparing {
            background-color: #fef3c7; /* yellow-100 */
            color: #92400e;            /* yellow-800 */
            border: 1px solid #fde68a; /* yellow-200 */
        }
        .pill-ready {
            background-color: #dcfce7; /* green-100 */
            color: #166534;            /* green-800 */
            border: 1px solid #bbf7d0; /* green-200 */
        }

        /* ─── Item list: large, readable text ──────────────────── */
        .kitchen-items {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .kitchen-items li {
            display: flex;
            align-items: baseline;
            gap: 0.6rem;
            font-size: 1.05rem;
            font-weight: 600;
            color: #374151; /* gray-700 */
        }
        .kitchen-items .qty {
            flex-shrink: 0;
            min-width: 2.5rem;
            text-align: center;
            background: #f3f4f6; /* gray-100 */
            color: #111827;
            border-radius: 0.5rem;
            padding: 0.25rem 0.5rem;
            font-weight: 800;
            font-size: 1.1rem;
        }
        .kitchen-items .name {
            flex: 1;
            min-width: 0;
            overflow-wrap: anywhere;
        }

        /* ─── Big touch-target status buttons ──────────────────── */
        .status-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            width: 100%;
            padding: 0.85rem 0.5rem;
            border-radius: 0.75rem;
            border: 2px solid transparent;
            font-size: 0.85rem;
            font-weight: 800;
            letter-spacing: 0.03em;
            cursor: pointer;
            color: #374151;
            background: #f9fafb; /* gray-50 */
            border-color: #e5e7eb; /* gray-200 */
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1),
                        box-shadow 0.2s ease,
                        background-color 0.2s ease;
        }
        .status-btn:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 16px -6px rgba(0, 0, 0, 0.18);
        }
        .status-btn:active {
            transform: translateY(0) scale(0.97);
            transition: transform 0.08s ease;
        }
        .status-btn:focus-visible {
            outline: none;
            box-shadow: 0 0 0 2px #ffffff, 0 0 0 4px #6b7280;
        }
        .status-btn.active {
            border-color: currentColor;
        }
        .status-btn[data-status="PENDING"].active {
            background: #dbeafe; color: #1e40af; border-color: #2563eb;
        }
        .status-btn[data-status="PREPARING"].active {
            background: #fef3c7; color: #92400e; border-color: #d97706;
        }
        .status-btn[data-status="READY"].active {
            background: #dcfce7; color: #166534; border-color: #16a34a;
        }
        .status-btn[data-status="COMPLETED"].active {
            background: #f3f4f6; color: #374151; border-color: #4b5563;
        }

        /* ─── Stats row (item count / total) ───────────────────── */
        .kitchen-stat {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1rem;
            font-weight: 700;
            color: #111827;
        }
    </style>
</head>
<body>
<nav th:replace="~{fragments/layout :: nav(activePage='kitchen')}"></nav>

<main class="uk-container max-w-7xl mx-auto px-4 py-8">
    <!-- Page header -->
    <section class="dash-hero p-6 sm:p-8 mb-8">
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
            <div>
                <p class="text-sm font-medium uppercase tracking-wider opacity-50 mb-1">Cafe ERP</p>
                <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight">Kitchen Queue</h1>
                <p class="text-sm opacity-50 mt-1">Live order ticker — tap a status to advance an order.</p>
            </div>
            <span id="kitchen-clock" class="pill pill-pending"></span>
        </div>
    </section>

    <!-- Empty state -->
    <div th:if="${#lists.isEmpty(orders)}" class="stat-card"
         style="background:#ffffff;border:1px solid #e5e7eb;border-radius:1.25rem;box-shadow:0 1px 2px rgba(0,0,0,0.05);padding:3rem;text-align:center;">
        <div class="flex flex-col items-center gap-3">
            <span class="text-5xl" aria-hidden="true">&#x2705;</span>
            <h2 class="text-xl font-extrabold">All caught up!</h2>
            <p class="text-sm text-muted-foreground">No active orders. New orders will appear here.</p>
        </div>
    </div>

    <!-- Order cards grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5">
        <div th:each="order : ${orders}" class="kitchen-card"
             th:classappend="${order.status.name() == 'PREPARING'} ? 'kitchen-card--preparing' : (${order.status.name() == 'READY'} ? 'kitchen-card--ready' : 'kitchen-card--pending')">

            <!-- Card header -->
            <div class="flex items-center justify-between gap-3 p-5 pb-3">
                <div class="flex items-center gap-3 min-w-0">
                    <span class="text-lg font-extrabold tracking-tight" th:text="'#' + ${order.id}">#1</span>
                    <span class="pill"
                          th:classappend="${order.status.name() == 'PENDING'} ? 'pill-pending' : (${order.status.name() == 'PREPARING'} ? 'pill-preparing' : 'pill-ready')"
                          th:text="${order.status}">PENDING</span>
                </div>
                <small class="text-sm font-semibold text-muted-foreground whitespace-nowrap"
                       th:text="${#temporals.format(order.createdAt, 'HH:mm')}">08:00</small>
            </div>

            <!-- Card body: items -->
            <div class="flex-1 px-5 py-3">
                <ul class="kitchen-items">
                    <li th:each="item : ${order.items}">
                        <span class="qty" th:text="${item.quantity}">2</span>
                        <span class="name" th:text="${item.itemName}">Latte</span>
                    </li>
                </ul>
            </div>

            <!-- Card footer: count + status update -->
            <div class="p-5 pt-3 border-t" style="border-color:#f3f4f6;">
                <div class="flex items-center justify-between gap-3 mb-4">
                    <span class="kitchen-stat">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
                        <span th:text="${order.itemCount + ' items'}">3 items</span>
                    </span>
                    <span class="kitchen-stat">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                        <span th:text="'$' + ${#numbers.formatDecimal(order.totalAmount, 1, 2)}">$0.00</span>
                    </span>
                </div>

                <!-- Status update form — SAME action/method/select name as the
                     original (no binding changes); only the visual chrome changed. -->
                <form th:action="@{/kitchen/{id}/status(id=${order.id})}" method="post">
                    <div class="grid grid-cols-2 gap-2">
                        <button type="button" class="status-btn"
                                th:classappend="${order.status.name() == 'PENDING'} ? 'active' : ''"
                                data-status="PENDING" th:attr="data-order-id=${order.id}">Pending</button>
                        <button type="button" class="status-btn"
                                th:classappend="${order.status.name() == 'PREPARING'} ? 'active' : ''"
                                data-status="PREPARING" th:attr="data-order-id=${order.id}">Preparing</button>
                        <button type="button" class="status-btn"
                                th:classappend="${order.status.name() == 'READY'} ? 'active' : ''"
                                data-status="READY" th:attr="data-order-id=${order.id}">Ready</button>
                        <button type="button" class="status-btn"
                                th:classappend="${order.status.name() == 'COMPLETED'} ? 'active' : ''"
                                data-status="COMPLETED" th:attr="data-order-id=${order.id}">Complete</button>
                    </div>
                    <!-- Preserved original select name="status" (functionally unchanged) -->
                    <select name="status" style="display:none" aria-hidden="true">
                        <option th:each="s : ${statuses}" th:value="${s.name()}" th:text="${s.name()}"
                                th:selected="${s == order.status}"></option>
                    </select>
                </form>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: assistant-widget}"></div>

<!-- Kitchen queue behavior: live clock + status quick-action buttons.
     No polling is added — this page simply re-renders on each POST
     redirect, exactly as the original did. -->
<script>
    (function () {
        // ---- Live clock (cosmetic only) ----
        var clock = document.getElementById('kitchen-clock');
        if (clock) {
            function tick() {
                var now = new Date();
                clock.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            }
            tick();
            setInterval(tick, 1000);
        }

        // ---- Status quick buttons ----
        // Each large button drives the SAME underlying <select name="status">
        // + form POST as the original UI, preserving the exact submitting
        // behavior (same action /kitchen/{id}/status, same param "status").
        var buttons = document.querySelectorAll('.status-btn');
        buttons.forEach(function (btn) {
            btn.addEventListener('click', function () {
                var card = btn.closest('.kitchen-card');
                if (!card) return;
                var form = card.querySelector('form');
                var select = form ? form.querySelector('select[name="status"]') : null;
                if (!form || !select) return;
                select.value = btn.getAttribute('data-status');
                form.submit();
            });
        });
    })();
</script>
</body>
</html>

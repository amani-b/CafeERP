<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kitchen Queue - Cafe ERP</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/franken-ui@2.1.2/dist/css/core.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/franken-ui@2.1.2/dist/css/utilities.min.css">
</head>
<body>
<nav th:replace="~{fragments/layout :: nav(activePage='kitchen')}"></nav>

<main class="uk-container uk-margin-top">
    <h1 class="uk-h2">Kitchen Queue</h1>

    <div th:if="${#lists.isEmpty(orders)}" class="uk-alert-primary" uk-alert>
        No active orders. All orders are completed.
    </div>

    <div class="uk-child-width-1-1 uk-grid-medium" uk-grid th:each="order : ${orders}">
        <div>
            <div class="uk-card uk-card-default">
                <div class="uk-card-header uk-flex uk-flex-between">
                    <span>
                        <strong th:text="'Order #' + ${order.id}">Order #1</strong>
                        <span class="uk-label uk-margin-small-left" th:text="${order.status}">PENDING</span>
                    </span>
                    <small class="uk-text-muted" th:text="${#temporals.format(order.createdAt, 'yyyy-MM-dd HH:mm')}">2026-07-04 08:00</small>
                </div>
                <div class="uk-card-body">
                    <ul class="uk-list uk-list-small uk-margin-remove-top">
                        <li th:each="item : ${order.items}" th:text="${item.itemName + ' x' + item.quantity}">
                            Latte x 2
                        </li>
                    </ul>
                    <div class="uk-flex uk-flex-between">
                        <span class="uk-text-muted" th:text="'Items: ' + ${order.itemCount} + ' | Total: $' + ${#numbers.formatDecimal(order.totalAmount, 1, 2)}">Items: 0 | Total: $0.00</span>
                        <form th:action="@{/kitchen/{id}/status(id=${order.id})}" method="post" class="uk-form-inline">
                            <select name="status" class="uk-select uk-form-small uk-width-auto uk-margin-small-right">
                                <option th:each="s : ${statuses}" th:value="${s.name()}" th:text="${s.name()}" th:selected="${s == order.status}"></option>
                            </select>
                            <button type="submit" class="uk-button uk-button-default uk-button-small">Update</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: assistant-widget}"></div>
</body>
</html>

<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Assistant Logs - Cafe ERP</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/franken-ui@2.1.2/dist/css/core.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/franken-ui@2.1.2/dist/css/utilities.min.css">
</head>
<body>
<nav th:replace="~{fragments/layout :: nav(activePage='assistant-admin')}"></nav>

<main class="uk-container uk-margin-top">
    <h1 class="uk-h2">Assistant Chat Logs</h1>

    <div class="uk-overflow-auto">
        <table class="uk-table uk-table-striped uk-table-middle">
            <thead>
            <tr>
                <th>User ID</th>
                <th>Username</th>
                <th>Role</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(users)}">
                <td colspan="4" class="uk-text-center uk-text-muted">No users have used the assistant yet.</td>
            </tr>
            <tr th:each="u : ${users}">
                <td th:text="${u.id}">1</td>
                <td th:text="${u.username}">staff1</td>
                <td th:text="${u.role}">STAFF</td>
                <td>
                    <a class="uk-button uk-button-default uk-button-small" th:href="@{/admin/assistant/{id}(id=${u.id})}">View Thread</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>

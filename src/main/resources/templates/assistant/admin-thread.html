<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Assistant Thread - Cafe ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Cafe ERP</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
                aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Dashboard</a></li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')"><a class="nav-link" th:href="@{/categories}">Categories</a></li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')"><a class="nav-link" th:href="@{/menu}">Menu</a></li>
                <li class="nav-item" sec:authorize="hasAnyRole('STAFF','ADMIN')"><a class="nav-link" th:href="@{/orders}">Orders</a></li>
                <li class="nav-item" sec:authorize="hasAnyRole('KITCHEN','ADMIN')"><a class="nav-link" th:href="@{/kitchen}">Kitchen</a></li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')"><a class="nav-link" th:href="@{/reports}">Reports</a></li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')"><a class="nav-link" th:href="@{/inventory}">Inventory</a></li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')"><a class="nav-link" th:href="@{/admin/assistant}">Assistant Logs</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/account/password}">Change Password</a></li>
                <li class="nav-item">
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="nav-link btn btn-link border-0 bg-transparent" style="text-decoration:none;">Logout</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="mb-0">
            Chat Thread
            <small class="text-muted fs-5" th:if="${userName}">— <span th:text="${userName}">staff1</span></small>
        </h1>
        <a class="btn btn-outline-secondary" th:href="@{/admin/assistant}">Back to Logs</a>
    </div>

    <div class="card">
        <div class="card-body p-4" style="max-height: 70vh; overflow-y: auto;">
            <div th:if="${#lists.isEmpty(messages)}" class="text-center text-muted py-4">
                No messages in this thread.
            </div>
            <div th:each="msg : ${messages}" class="mb-3">
                <div class="d-flex align-items-center mb-1">
                    <span class="badge me-2"
                          th:classappend="${msg.role.name() == 'USER' ? 'bg-primary' : 'bg-success'}"
                          th:text="${msg.role.name() == 'USER' ? 'User' : 'Assistant'}">User</span>
                    <small class="text-muted" th:text="${#temporals.format(msg.createdAt, 'yyyy-MM-dd HH:mm:ss')}">2026-07-26 12:00:00</small>
                </div>
                <div class="p-3 rounded"
                     th:classappend="${msg.role.name() == 'USER' ? 'bg-light border' : 'bg-success bg-opacity-10 border border-success'}">
                    <p class="mb-0 text-pre-wrap" style="white-space: pre-wrap;" th:text="${msg.content}">Message content here.</p>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

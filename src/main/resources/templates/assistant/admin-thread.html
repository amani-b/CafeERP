<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Assistant Thread - Cafe ERP</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/franken-ui@2.1.2/dist/css/core.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/franken-ui@2.1.2/dist/css/utilities.min.css">
</head>
<body>
<nav th:replace="~{fragments/layout :: nav(activePage='assistant-admin')}"></nav>

<main class="uk-container uk-margin-top">
    <div class="uk-flex uk-flex-between uk-margin-bottom">
        <h1 class="uk-h2 uk-margin-remove">
            Chat Thread
            <small class="uk-text-muted uk-text-small" th:if="${userName}">— <span th:text="${userName}">staff1</span></small>
        </h1>
        <a class="uk-button uk-button-default" th:href="@{/admin/assistant}">Back to Logs</a>
    </div>

    <div class="uk-card uk-card-default">
        <div class="uk-card-body" style="max-height: 70vh; overflow-y: auto;">
            <div th:if="${#lists.isEmpty(messages)}" class="uk-text-center uk-text-muted">
                No messages in this thread.
            </div>
            <div th:each="msg : ${messages}" class="uk-margin">
                <div class="uk-flex uk-flex-middle uk-margin-small-bottom">
                    <span class="uk-label uk-margin-small-right"
                          th:classappend="${msg.role.name() == 'USER'} ? 'uk-label-primary' : 'uk-label-success'"
                          th:text="${msg.role.name() == 'USER'} ? 'User' : 'Assistant'">User</span>
                    <small class="uk-text-muted" th:text="${#temporals.format(msg.createdAt, 'yyyy-MM-dd HH:mm:ss')}">2026-07-26 12:00:00</small>
                </div>
                <div class="uk-padding-small uk-border-rounded"
                     th:classappend="${msg.role.name() == 'USER'} ? 'uk-background-muted uk-border' : 'uk-background-success uk-background-opacity-10 uk-border-success'">
                    <p class="uk-margin-remove" style="white-space: pre-wrap;" th:text="${msg.content}">Message content here.</p>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>

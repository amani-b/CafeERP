# ================================================
# TEST CONFIGURATION — H2 in PostgreSQL mode
# ================================================
# Runs the REAL Flyway migrations against an in-memory database so the full
# Spring MVC + Security stack is exercised per-request via MockMvc.
spring.datasource.url=jdbc:h2:mem:cafeerp_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.thymeleaf.cache=true